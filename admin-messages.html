<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Messages - Meteur Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ff7900;
      color: white;
      padding: 18px 5%;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .page-header {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .page-header h1 {
      margin-bottom: 8px;
    }

    .page-header p {
      color: #666;
    }

    .message-box {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .message-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .customer-name {
      font-size: 20px;
      font-weight: bold;
    }

    .date {
      color: #777;
      font-size: 14px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 18px;
    }

    .detail {
      background: #fafafa;
      padding: 12px;
      border-radius: 8px;
    }

    .detail strong {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 13px;
    }

    .detail span {
      word-break: break-word;
    }

    .subject {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .message-text {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 7px;
      background: white;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
      background: #ff7900;
      color: white;
    }

    button:hover {
      background: #e66d00;
    }

    .delete-btn {
      background: #d93025;
    }

    .delete-btn:hover {
      background: #b42318;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      background: #fff3e8;
      color: #d65f00;
      font-size: 13px;
      font-weight: bold;
    }

    .empty,
    .error {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .error {
      color: #a12626;
    }

    footer {
      background: #222;
      color: white;
      margin-top: 50px;
      padding: 30px 5%;
      text-align: center;
    }

    footer a {
      color: white;
      text-decoration: none;
    }

    @media (max-width: 750px) {
      .header-inner {
        flex-direction: column;
      }

      .nav {
        justify-content: center;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .message-top {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="admin-dashboard.html" class="logo">🛒 Meteur Admin</a>

    <nav class="nav">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-customers.html">Customers</a>
      <a href="admin-sellers.html">Sellers</a>
      <a href="admin-products.html">Products</a>
      <a href="admin-orders.html">Orders</a>
      <a href="index.html">View Store</a>
    </nav>
  </div>
</header>

<main>

  <section class="page-header">
    <h1>💬 Customer Messages</h1>
    <p>View and manage messages submitted through the Meteur Contact Us page.</p>
  </section>

  <div id="messagesContainer">
    <div class="empty">Loading customer messages...</div>
  </div>

</main>

<footer>
  <p>© 2026 Meteur Online Shopping. All rights reserved.</p>
</footer>

<script>
  const SUPABASE_URL = "https://nytsdeupaootukcullgi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_cIqzHoafy_AEdB48KS_Wpg_LDqE1sFC";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const messagesContainer = document.getElementById("messagesContainer");

  async function checkAdmin() {
    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
      window.location.href = "login.html";
      return false;
    }

    const { data, error } = await supabaseClient.rpc(
      "is_current_user_admin"
    );

    if (error || data !== true) {
      window.location.href = "dashboard.html";
      return false;
    }

    return true;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(dateValue) {
    if (!dateValue) return "Unknown";

    const date = new Date(dateValue);

    return date.toLocaleString("en-KE", {
      dateStyle: "medium",
      timeStyle: "short"
    });
  }

  async function loadMessages() {
    const isAdmin = await checkAdmin();

    if (!isAdmin) return;

    const {
      data: messages,
      error
    } = await supabaseClient
      .from("customer_messages")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);

      messagesContainer.innerHTML = `
        <div class="error">
          Unable to load customer messages.
        </div>
      `;

      return;
    }

    if (!messages || messages.length === 0) {
      messagesContainer.innerHTML = `
        <div class="empty">
          <h2>No Customer Messages</h2>
          <p>Customer messages submitted through the Contact Us page will appear here.</p>
        </div>
      `;

      return;
    }

    messagesContainer.innerHTML = messages.map(message => `
      <article class="message-box">

        <div class="message-top">
          <div>
            <div class="customer-name">
              👤 ${escapeHtml(message.first_name)} ${escapeHtml(message.last_name)}
            </div>

            <div class="date">
              Received: ${escapeHtml(formatDate(message.created_at))}
            </div>
          </div>

          <div>
            <span class="status">
              ${escapeHtml(message.status || "New")}
            </span>
          </div>
        </div>

        <div class="details">

          <div class="detail">
            <strong>Email</strong>
            <span>${escapeHtml(message.email)}</span>
          </div>

          <div class="detail">
            <strong>Phone</strong>
            <span>${escapeHtml(message.phone || "Not provided")}</span>
          </div>

          <div class="detail">
            <strong>Message ID</strong>
            <span>${escapeHtml(message.id)}</span>
          </div>

        </div>

        <div class="subject">
          ${escapeHtml(message.subject)}
        </div>

        <div class="message-text">
          ${escapeHtml(message.message)}
        </div>

        <div class="actions">

          <select id="status-${escapeHtml(message.id)}">
            <option value="New" ${message.status === "New" ? "selected" : ""}>New</option>
            <option value="Read" ${message.status === "Read" ? "selected" : ""}>Read</option>
            <option value="Replied" ${message.status === "Replied" ? "selected" : ""}>Replied</option>
            <option value="Closed" ${message.status === "Closed" ? "selected" : ""}>Closed</option>
          </select>

          <button onclick="updateStatus('${escapeHtml(message.id)}')">
            Update Status
          </button>

          <button
            class="delete-btn"
            onclick="deleteMessage('${escapeHtml(message.id)}')">
            Delete
          </button>

        </div>

      </article>
    `).join("");
  }

  async function updateStatus(messageId) {
    const select = document.getElementById("status-" + messageId);

    if (!select) return;

    const newStatus = select.value;

    const { error } = await supabaseClient
      .from("customer_messages")
      .update({
        status: newStatus,
        updated_at: new Date().toISOString()
      })
      .eq("id", messageId);

    if (error) {
      alert("Unable to update the message status.");
      console.error(error);
      return;
    }

    alert("Message status updated successfully.");

    loadMessages();
  }

  async function deleteMessage(messageId) {
    const confirmed = confirm(
      "Are you sure you want to delete this customer message?"
    );

    if (!confirmed) return;

    const { error } = await supabaseClient
      .from("customer_messages")
      .delete()
      .eq("id", messageId);

    if (error) {
      alert("Unable to delete this message.");
      console.error(error);
      return;
    }

    alert("Customer message deleted successfully.");

    loadMessages();
  }

  loadMessages();
</script>

</body>
</html>
