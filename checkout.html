<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Meteur Online Shopping</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #f68b1e;
            color: white;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .box h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .payment-option {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .payment-option input {
            width: auto;
            margin: 0 8px 0 0;
        }

        .payment-option strong {
            display: inline;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            font-size: 15px;
            margin-bottom: 6px;
        }

        .item-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 21px;
            font-weight: bold;
            color: #f68b1e;
        }

        .place-order {
            width: 100%;
            border: none;
            background: #f68b1e;
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .place-order:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 8px;
        }

        .empty a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #f68b1e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }

        .notice {
            background: #fff4e5;
            border-left: 4px solid #f68b1e;
            padding: 12px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            text-align: center;
            padding: 35px 5%;
        }

        footer a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        @media (max-width: 800px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="index.html" class="logo">Meteur</a>

    <div class="nav-links">
        <a href="shop.html">Shop</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="cart.html">Cart</a>
        <a href="dashboard.html">Account</a>
    </div>

</header>

<main class="container">

    <h1>Checkout</h1>

    <div id="pageContent">
        <div class="loading">Loading your cart...</div>
    </div>

</main>

<footer>

    <p>© 2026 Meteur Online Shopping. All rights reserved.</p>

    <br>

    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shipping.html">Shipping</a>
    <a href="returns.html">Returns</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>

</footer>

<script>

    let currentUser = null;
    let cartItems = [];
    let subtotal = 0;
    let deliveryFee = 0;

    const pageContent =
        document.getElementById("pageContent");

    async function getCurrentUser() {

        const {
            data: { user },
            error
        } = await supabaseClient.auth.getUser();

        if (error) {
            console.error("Auth error:", error);
            return null;
        }

        return user;
    }

    async function loadCheckout() {

        currentUser = await getCurrentUser();

        if (!currentUser) {

            pageContent.innerHTML = `
                <div class="empty">
                    <h2>Please log in</h2>
                    <p>You must be logged in before checkout.</p>

                    <a href="login.html?redirect=checkout.html">
                        Login
                    </a>
                </div>
            `;

            return;
        }

        const {
            data,
            error
        } = await supabaseClient
            .from("cart_items")
            .select(`
                id,
                product_id,
                quantity,
                products (
                    id,
                    name,
                    price,
                    image_url,
                    stock
                )
            `)
            .eq("user_id", currentUser.id)
            .order("created_at", { ascending: true });

        if (error) {

            console.error("Cart loading error:", error);

            pageContent.innerHTML = `
                <div class="empty">
                    <h2>Could not load your cart</h2>
                    <p>Please refresh the page and try again.</p>
                </div>
            `;

            return;
        }

        cartItems = data || [];

        if (cartItems.length === 0) {

            pageContent.innerHTML = `
                <div class="empty">
                    <h2>Your cart is empty</h2>
                    <p>Add products to your cart before checkout.</p>

                    <a href="shop.html">
                        Continue Shopping
                    </a>
                </div>
            `;

            return;
        }

        calculateTotals();
        renderCheckout();
    }

    function calculateTotals() {

        subtotal = 0;

        cartItems.forEach(item => {

            if (!item.products) {
                return;
            }

            subtotal +=
                Number(item.products.price) *
                Number(item.quantity);
        });

        deliveryFee = subtotal >= 5000 ? 0 : 250;
    }

    function renderCheckout() {

        pageContent.innerHTML = `

            <div class="checkout-grid">

                <div>

                    <div class="box">

                        <h2>Delivery Information</h2>

                        <div class="notice">
                            Please provide the correct delivery details
                            so your order can be delivered successfully.
                        </div>

                        <form id="checkoutForm">

                            <div class="form-row">

                                <div>
                                    <label for="firstName">
                                        First Name
                                    </label>

                                    <input
                                        type="text"
                                        id="firstName"
                                        required
                                    >
                                </div>

                                <div>
                                    <label for="lastName">
                                        Last Name
                                    </label>

                                    <input
                                        type="text"
                                        id="lastName"
                                        required
                                    >
                                </div>

                            </div>

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="07XXXXXXXX"
                                required
                            >

                            <label for="county">
                                County
                            </label>

                            <select id="county" required>

                                <option value="">
                                    Select county
                                </option>

                                <option>Baringo</option>
                                <option>Bomet</option>
                                <option>Bungoma</option>
                                <option>Busia</option>
                                <option>Elgeyo-Marakwet</option>
                                <option>Embu</option>
                                <option>Garissa</option>
                                <option>Homa Bay</option>
                                <option>Isiolo</option>
                                <option>Kajiado</option>
                                <option>Kakamega</option>
                                <option>Kericho</option>
                                <option>Kiambu</option>
                                <option>Kirinyaga</option>
                                <option>Kisii</option>
                                <option>Kisumu</option>
                                <option>Kitui</option>
                                <option>Kwale</option>
                                <option>Laikipia</option>
                                <option>Lamu</option>
                                <option>Machakos</option>
                                <option>Makueni</option>
                                <option>Mandera</option>
                                <option>Marsabit</option>
                                <option>Meru</option>
                                <option>Migori</option>
                                <option>Mombasa</option>
                                <option>Murang'a</option>
                                <option>Nairobi</option>
                                <option>Nakuru</option>
                                <option>Nandi</option>
                                <option>Narok</option>
                                <option>Nyamira</option>
                                <option>Nyandarua</option>
                                <option>Nyeri</option>
                                <option>Samburu</option>
                                <option>Siaya</option>
                                <option>Taita-Taveta</option>
                                <option>Tana River</option>
                                <option>Tharaka-Nithi</option>
                                <option>Trans Nzoia</option>
                                <option>Turkana</option>
                                <option>Uasin Gishu</option>
                                <option>Vihiga</option>
                                <option>Wajir</option>
                                <option>West Pokot</option>

                            </select>

                            <label for="town">
                                Town / Area
                            </label>

                            <input
                                type="text"
                                id="town"
                                placeholder="Enter your town or area"
                                required
                            >

                            <label for="address">
                                Delivery Address
                            </label>

                            <textarea
                                id="address"
                                placeholder="Building, street, estate or other delivery details"
                                required
                            ></textarea>

                            <label for="postalCode">
                                Postal Code
                            </label>

                            <input
                                type="text"
                                id="postalCode"
                                placeholder="Optional"
                            >

                            <label for="deliveryNote">
                                Delivery Note
                            </label>

                            <textarea
                                id="deliveryNote"
                                placeholder="Optional instructions for delivery"
                            ></textarea>

                            <h2>Payment Method</h2>

                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="M-Pesa"
                                    required
                                >

                                <strong>M-Pesa</strong>

                                <br>

                                <small>
                                    Pay using M-Pesa. Payment processing
                                    will be connected in the next step.
                                </small>

                            </label>

                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="Cash on Delivery"
                                >

                                <strong>Cash on Delivery</strong>

                                <br>

                                <small>
                                    Pay when your order is delivered.
                                </small>

                            </label>

                            <button
                                type="submit"
                                class="place-order"
                                id="placeOrderButton"
                            >
                                Place Order
                            </button>

                        </form>

                    </div>

                </div>

                <div>

                    <div class="box">

                        <h2>Order Summary</h2>

                        <div id="itemsContainer"></div>

                        <div class="summary-row">
                            <span>Subtotal</span>
                            <strong>
                                KSh ${subtotal.toLocaleString()}
                            </strong>
                        </div>

                        <div class="summary-row">
                            <span>Delivery</span>
                            <strong>
                                ${
                                    deliveryFee === 0
                                    ? "FREE"
                                    : `KSh ${deliveryFee.toLocaleString()}`
                                }
                            </strong>
                        </div>

                        <div class="summary-row total">
                            <span>Total</span>
                            <strong>
                                KSh ${(subtotal + deliveryFee).toLocaleString()}
                            </strong>
                        </div>

                    </div>

                </div>

            </div>
        `;

        renderItems();

        document
            .getElementById("checkoutForm")
            .addEventListener("submit", placeOrder);
    }

    function renderItems() {

        const itemsContainer =
            document.getElementById("itemsContainer");

        itemsContainer.innerHTML =
            cartItems.map(item => {

                const product = item.products;

                if (!product) {
                    return "";
                }

                const itemTotal =
                    Number(product.price) *
                    Number(item.quantity);

                const image =
                    product.image_url ||
                    "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80";

                return `

                    <div class="cart-item">

                        <img
                            src="${escapeAttribute(image)}"
                            alt="${escapeAttribute(product.name)}"
                        >

                        <div class="item-info">

                            <h3>
                                ${escapeHtml(product.name)}
                            </h3>

                            <p>
                                Quantity: ${Number(item.quantity)}
                            </p>

                            <p>
                                KSh ${itemTotal.toLocaleString()}
                            </p>

                        </div>

                    </div>

                `;

            }).join("");
    }

    async function placeOrder(event) {

        event.preventDefault();

        const button =
            document.getElementById("placeOrderButton");

        button.disabled = true;
        button.textContent = "Processing Order...";

        try {

            /*
             * Check the cart again before placing the order.
             * This prevents checkout from using outdated stock information.
             */

            const {
                data: latestCart,
                error: cartError
            } = await supabaseClient
                .from("cart_items")
                .select(`
                    id,
                    product_id,
                    quantity,
                    products (
                        id,
                        name,
                        price,
                        image_url,
                        stock
                    )
                `)
                .eq("user_id", currentUser.id);

            if (cartError) {
                throw cartError;
            }

            if (!latestCart || latestCart.length === 0) {

                alert("Your cart is empty.");

                window.location.href = "cart.html";

                return;
            }

            /*
             * Validate stock.
             */

            for (const item of latestCart) {

                if (!item.products) {
                    throw new Error(
                        "A product in your cart is no longer available."
                    );
                }

                if (
                    Number(item.quantity) >
                    Number(item.products.stock)
                ) {

                    alert(
                        `${item.products.name} does not have enough stock.`
                    );

                    window.location.href = "cart.html";

                    return;
                }
            }

            const firstName =
                document
                    .getElementById("firstName")
                    .value
                    .trim();

            const lastName =
                document
                    .getElementById("lastName")
                    .value
                    .trim();

            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();

            const county =
                document
                    .getElementById("county")
                    .value;

            const town =
                document
                    .getElementById("town")
                    .value
                    .trim();

            const address =
                document
                    .getElementById("address")
                    .value
                    .trim();

            const postalCode =
                document
                    .getElementById("postalCode")
                    .value
                    .trim();

            const deliveryNote =
                document
                    .getElementById("deliveryNote")
                    .value
                    .trim();

            const payment =
                document.querySelector(
                    'input[name="payment"]:checked'
                ).value;

            /*
             * Recalculate totals from the latest cart.
             */

            let latestSubtotal = 0;

            latestCart.forEach(item => {

                latestSubtotal +=
                    Number(item.products.price) *
                    Number(item.quantity);

            });

            const latestDeliveryFee =
                latestSubtotal >= 5000 ? 0 : 250;

            const latestTotal =
                latestSubtotal + latestDeliveryFee;

            /*
             * Generate order number.
             */

            const orderNumber =
                "MET-" +
                Date.now().toString(36).toUpperCase() +
                "-" +
                Math.floor(
                    1000 + Math.random() * 9000
                );

            /*
             * Save a snapshot of the purchased products
             * inside the order.
             */

            const orderItems =
                latestCart.map(item => ({

                    product_id: item.product_id,

                    name: item.products.name,

                    price: Number(item.products.price),

                    quantity: Number(item.quantity),

                    image_url: item.products.image_url || null

                }));

            const orderData = {

                user_id: currentUser.id,

                order_number: orderNumber,

                customer_email:
                    currentUser.email || "",

                recipient_name:
                    `${firstName} ${lastName}`,

                phone: phone,

                county: county,

                town: town,

                address:
                    postalCode
                    ? `${address}, ${postalCode}`
                    : address,

                delivery_note:
                    deliveryNote || null,

                payment_method:
                    payment,

                subtotal:
                    latestSubtotal,

                delivery_fee:
                    latestDeliveryFee,

                total:
                    latestTotal,

                status:
                    payment === "M-Pesa"
                    ? "Payment Pending"
                    : "Processing",

                items:
                    orderItems

            };

            /*
             * Create the order in Supabase.
             */

            const {
                data: createdOrder,
                error: orderError
            } = await supabaseClient
                .from("orders")
                .insert(orderData)
                .select()
                .single();

            if (orderError) {
                throw orderError;
            }

            /*
             * Save the order number temporarily so
             * the confirmation page can also access it.
             */

            sessionStorage.setItem(
                "meteurLatestOrder",
                JSON.stringify(createdOrder)
            );

            /*
             * IMPORTANT:
             *
             * We do NOT clear cart_items here yet.
             *
             * The next step will handle clearing the
             * customer's database cart after a successful order.
             */

            window.location.href =
                `order-confirmation.html?order=${encodeURIComponent(orderNumber)}`;

        } catch (error) {

            console.error(
                "Order creation error:",
                error
            );

            alert(
                "We could not place your order. Please check your information and try again."
            );

            button.disabled = false;
            button.textContent = "Place Order";
        }
    }

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
        return escapeHtml(value);
    }

    loadCheckout();

</script>

</body>
</html>
