<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Meteur Online Shopping</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #ff6b00;
      color: white;
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #ff6b00;
      margin-bottom: 10px;
    }

    .intro {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #ff6b00;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e85f00;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #messageBox {
      margin-top: 18px;
      padding: 14px;
      border-radius: 7px;
      display: none;
      line-height: 1.5;
    }

    .success {
      background: #e8f8ee;
      color: #18733a;
    }

    .error {
      background: #fdeaea;
      color: #a32121;
    }

    footer {
      margin-top: 50px;
      background: #222;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        gap: 10px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Meteur Online Shopping</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="dashboard.html">My Account</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">

      <h1>Contact Us</h1>

      <p class="intro">
        Have a question or need help? Send us a message and our support team
        will review it shortly.
      </p>

      <form id="contactForm">

        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" required>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone">
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" required></textarea>
        </div>

        <button type="submit" id="submitButton">
          Send Message
        </button>

        <div id="messageBox"></div>

      </form>

    </div>
  </main>

  <footer>
    <p>© 2026 Meteur Online Shopping. All rights reserved.</p>
  </footer>

  <script>
    const SUPABASE_URL =
      "https://nytsdeupaootukcullgi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cIqzHoafy_AEdB48KS_Wpg_LDqE1sFC";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const contactForm =
      document.getElementById("contactForm");

    const submitButton =
      document.getElementById("submitButton");

    const messageBox =
      document.getElementById("messageBox");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = type;
      messageBox.style.display = "block";
    }

    contactForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      submitButton.disabled = true;
      submitButton.textContent = "Sending...";

      messageBox.style.display = "none";

      const firstName =
        document.getElementById("firstName").value.trim();

      const lastName =
        document.getElementById("lastName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const subject =
        document.getElementById("subject").value.trim();

      const message =
        document.getElementById("message").value.trim();

      try {

        /*
         * STEP 1
         * Save the customer message.
         *
         * We intentionally do NOT use .select()
         * or .single() here because anonymous customers
         * are allowed to insert messages but are not
         * allowed to read them back.
         */

        const { error } = await supabaseClient
          .from("customer_messages")
          .insert([
            {
              first_name: firstName,
              last_name: lastName,
              email: email,
              phone: phone,
              subject: subject,
              message: message,
              status: "New"
            }
          ]);

        if (error) {

          console.error(
            "Supabase message error:",
            error
          );

          throw new Error(
            "Your message could not be submitted. Please try again."
          );
        }

        /*
         * STEP 2
         * Call the secure Vercel API.
         *
         * The Resend API key is NOT placed
         * anywhere in this browser code.
         */

        const replyResponse = await fetch(
          "/api/contact-reply.js",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              firstName: firstName
            })
          }
        );

        let replyResult = {};

        try {
          replyResult = await replyResponse.json();
        } catch (jsonError) {
          replyResult = {};
        }

        /*
         * The customer message was already saved.
         * Therefore, even if email sending fails,
         * we do not tell the customer that their
         * message was lost.
         */

        if (
          !replyResponse.ok ||
          !replyResult.success
        ) {

          console.error(
            "Automatic reply error:",
            replyResult
          );

          showMessage(
            "Your message has been received successfully, but the confirmation email could not be sent.",
            "success"
          );

          contactForm.reset();

          return;
        }

        /*
         * STEP 3
         * Both message storage and email succeeded.
         */

        showMessage(
          "Your message has been submitted successfully. A confirmation email has been sent to your email address.",
          "success"
        );

        contactForm.reset();

      } catch (error) {

        console.error(
          "Contact form error:",
          error
        );

        showMessage(
          error.message ||
          "Something went wrong. Please try again.",
          "error"
        );

      } finally {

        submitButton.disabled = false;
        submitButton.textContent = "Send Message";

      }

    });
  </script>

</body>
</html>
