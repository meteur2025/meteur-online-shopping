<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Meteur Online Shopping</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Meteur Supabase Configuration -->
    <script src="supabase-config.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="container">

            <div class="logo">
                <a href="index.html">
                    Meteur Online Shopping
                </a>
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="cart.html">Cart</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="auth-section">

            <div class="auth-container">

                <div class="auth-card">

                    <div class="auth-header">

                        <div class="lock-icon">
                            🔐
                        </div>

                        <h1>Forgot Your Password?</h1>

                        <p>
                            Enter your email address and we'll send you
                            a secure password reset link.
                        </p>

                    </div>

                    <div
                        id="message"
                        class="auth-message"
                    ></div>

                    <form id="forgotPasswordForm">

                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                required
                                autocomplete="email"
                            >

                        </div>

                        <button
                            type="submit"
                            id="resetButton"
                            class="auth-button"
                        >
                            Send Reset Link
                        </button>

                    </form>

                    <div class="auth-divider">
                        <span>OR</span>
                    </div>

                    <div class="login-link">

                        <p>
                            Remember your password?
                            <a href="login.html">
                                Login here
                            </a>
                        </p>

                    </div>

                    <div class="register-link">

                        <p>
                            Don't have an account?
                            <a href="register.html">
                                Create an account
                            </a>
                        </p>

                    </div>

                    <div class="back-home">

                        <a href="index.html">
                            ← Back to shopping
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 Meteur Online Shopping.
                All rights reserved.
            </p>

        </div>

    </footer>

    <script>

        const forgotPasswordForm =
            document.getElementById("forgotPasswordForm");

        const resetButton =
            document.getElementById("resetButton");

        const message =
            document.getElementById("message");

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "auth-message " + type;

        }

        forgotPasswordForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email")
                    .value
                    .trim();

                if (!email) {

                    showMessage(
                        "Please enter your email address.",
                        "error"
                    );

                    return;
                }

                resetButton.disabled = true;

                resetButton.textContent =
                    "Sending...";

                showMessage(
                    "Sending password reset link...",
                    "info"
                );

                try {

                    const { error } =
                        await supabaseClient.auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo:
                                        "https://meteur-online-shopping.vercel.app/reset-password.html"
                                }
                            );

                    if (error) {
                        throw error;
                    }

                    showMessage(
                        "If an account exists with this email, a password reset link has been sent. Please check your inbox and spam folder.",
                        "success"
                    );

                    resetButton.textContent =
                        "Reset Link Sent";

                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Unable to send the reset email. Please try again.",
                        "error"
                    );

                    resetButton.disabled =
                        false;

                    resetButton.textContent =
                        "Send Reset Link";

                }

            }
        );

    </script>

    <style>

        .auth-section {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background: #f7f7f7;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
        }

        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .lock-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fff1e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .auth-header h1 {
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #666;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f68b1e;
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #f68b1e;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-button:hover {
            opacity: 0.9;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
            line-height: 1.5;
        }

        .auth-message.error,
        .auth-message.success,
        .auth-message.info {
            display: block;
        }

        .auth-message.error {
            background: #ffe5e5;
            color: #b00020;
        }

        .auth-message.success {
            background: #e5f7e9;
            color: #187a32;
        }

        .auth-message.info {
            background: #e8f1ff;
            color: #245ea8;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            color: #999;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .login-link,
        .register-link,
        .back-home {
            text-align: center;
        }

        .login-link a,
        .register-link a,
        .back-home a {
            color: #f68b1e;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link {
            margin-top: 15px;
        }

        .back-home {
            margin-top: 20px;
        }

        @media (max-width: 600px) {

            .auth-card {
                padding: 25px;
            }

        }

    </style>

</body>
</html>
