<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meteur Online Shopping</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="index.html">Meteur Online Shopping</a>
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="cart.html">Cart</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-container">

                <div class="auth-card">

                    <div class="auth-header">
                        <h1>Welcome Back</h1>
                        <p>Sign in to your Meteur Online Shopping account.</p>
                    </div>

                    <div id="message" class="auth-message"></div>

                    <form id="loginForm">

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                                autocomplete="email"
                            >
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password"
                            >
                        </div>

                        <div class="form-options">
                            <a href="forgot-password.html">
                                Forgot password?
                            </a>
                        </div>

                        <button type="submit" id="loginButton" class="auth-button">
                            Login
                        </button>

                    </form>

                    <div class="auth-divider">
                        <span>OR</span>
                    </div>

                    <div class="register-link">
                        <p>
                            Don't have an account?
                            <a href="register.html">Create an account</a>
                        </p>
                    </div>

                    <div class="back-home">
                        <a href="index.html">← Back to shopping</a>
                    </div>

                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Meteur Online Shopping. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "auth-message " + type;
        }

        async function redirectUser(user) {

            /*
             * First check whether the signed-in account
             * is an active administrator.
             */
            const { data: admin, error: adminError } =
                await supabaseClient
                    .from("admins")
                    .select("user_id, name, email, role, status")
                    .eq("user_id", user.id)
                    .eq("status", "Active")
                    .maybeSingle();

            if (adminError) {
                console.error("Admin check error:", adminError);
            }

            /*
             * Active administrator
             * → Admin Dashboard
             */
            if (admin) {
                showMessage(
                    "Administrator login successful. Redirecting to Admin Dashboard...",
                    "success"
                );

                setTimeout(function() {
                    window.location.href = "admin-dashboard.html";
                }, 1000);

                return;
            }

            /*
             * Normal customer
             * → Customer Dashboard
             */
            showMessage(
                "Login successful. Redirecting...",
                "success"
            );

            setTimeout(function() {
                window.location.href = "dashboard.html";
            }, 1000);
        }

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            if (!email || !password) {
                showMessage(
                    "Please enter your email and password.",
                    "error"
                );
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            showMessage(
                "Checking your account...",
                "info"
            );

            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    throw error;
                }

                if (!data.user) {
                    throw new Error(
                        "Unable to sign in. Please try again."
                    );
                }

                /*
                 * Make sure the email has been verified.
                 */
                if (!data.user.email_confirmed_at) {

                    await supabaseClient.auth.signOut();

                    localStorage.setItem(
                        "meteurVerificationEmail",
                        email
                    );

                    showMessage(
                        "Please confirm your email address before signing in.",
                        "error"
                    );

                    setTimeout(function() {
                        window.location.href = "verify-email.html";
                    }, 2000);

                    return;
                }

                /*
                 * Decide whether this is an Admin
                 * or a normal customer.
                 */
                await redirectUser(data.user);

            } catch (error) {

                console.error("Login error:", error);

                let errorMessage =
                    "Unable to log in. Please check your details and try again.";

                if (error.message) {

                    if (
                        error.message
                            .toLowerCase()
                            .includes("invalid login")
                    ) {
                        errorMessage =
                            "Incorrect email or password.";

                    } else if (
                        error.message
                            .toLowerCase()
                            .includes("email not confirmed")
                    ) {
                        errorMessage =
                            "Please confirm your email before logging in.";

                    } else {
                        errorMessage = error.message;
                    }
                }

                showMessage(
                    errorMessage,
                    "error"
                );

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

    <style>
        .auth-section {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background: #f7f7f7;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
        }

        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f68b1e;
        }

        .form-options {
            text-align: right;
            margin-bottom: 20px;
        }

        .form-options a,
        .register-link a,
        .back-home a {
            color: #f68b1e;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #f68b1e;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-button:hover {
            opacity: 0.9;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
        }

        .auth-message.error,
        .auth-message.success,
        .auth-message.info {
            display: block;
        }

        .auth-message.error {
            background: #ffe5e5;
            color: #b00020;
        }

        .auth-message.success {
            background: #e5f7e9;
            color: #187a32;
        }

        .auth-message.info {
            background: #e8f1ff;
            color: #245ea8;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            color: #999;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .register-link,
        .back-home {
            text-align: center;
        }

        .back-home {
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 25px;
            }
        }
    </style>

</body>
</html>
