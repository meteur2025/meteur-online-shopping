<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | Meteur Online Shopping</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #f68b1e;
            color: white;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }

        .search {
            flex: 1;
            max-width: 550px;
            display: flex;
        }

        .search input {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            font-size: 15px;
            border-radius: 5px 0 0 5px;
        }

        .search button {
            padding: 13px 20px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .breadcrumb {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .product-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .image-section {
            text-align: center;
        }

        .image-section img {
            width: 100%;
            max-width: 500px;
            height: 450px;
            object-fit: contain;
            border-radius: 8px;
        }

        .details h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .category {
            color: #777;
            margin-bottom: 15px;
        }

        .rating {
            color: #f68b1e;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: #f68b1e;
            margin-bottom: 5px;
        }

        .old-price {
            text-decoration: line-through;
            color: #888;
            margin-bottom: 20px;
        }

        .stock {
            margin: 15px 0;
            font-weight: bold;
        }

        .description {
            line-height: 1.7;
            color: #555;
            margin: 20px 0;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .quantity-box button {
            width: 40px;
            height: 40px;
            border: 1px solid #ccc;
            background: #eee;
            cursor: pointer;
            font-size: 20px;
        }

        .quantity-box span {
            min-width: 35px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 14px 22px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .cart-btn {
            background: #f68b1e;
            color: white;
        }

        .buy-btn {
            background: #222;
            color: white;
        }

        .wishlist-btn {
            background: white;
            color: #f68b1e;
            border: 2px solid #f68b1e;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            display: none;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            padding: 35px 5%;
            text-align: center;
        }

        footer a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 20px;
        }

        .error {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 8px;
        }

        @media (max-width: 800px) {
            .product-box {
                grid-template-columns: 1fr;
            }

            .image-section img {
                height: 350px;
            }

            .details h1 {
                font-size: 24px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                max-width: none;
            }

            .nav-links {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">Meteur</a>

    <form class="search" id="searchForm">
        <input type="text" id="searchInput" placeholder="Search products...">
        <button type="submit">Search</button>
    </form>

    <div class="nav-links">
        <a href="shop.html">Shop</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="cart.html">Cart</a>
        <a href="dashboard.html">Account</a>
    </div>
</header>

<main class="container">

    <div class="breadcrumb">
        <a href="index.html">Home</a> /
        <a href="shop.html">Shop</a> /
        Product
    </div>

    <div id="productContainer">
        <div class="loading">Loading product...</div>
    </div>

</main>

<footer>
    <p>© 2026 Meteur Online Shopping. All rights reserved.</p>
    <br>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shipping.html">Shipping</a>
    <a href="returns.html">Returns</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
</footer>

<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    let product = null;
    let quantity = 1;
    let currentUser = null;
    let isInWishlist = false;

    const container = document.getElementById("productContainer");

    async function getCurrentUser() {
        const {
            data: { user },
            error
        } = await supabaseClient.auth.getUser();

        if (error) {
            console.error("Auth error:", error);
            return null;
        }

        return user;
    }

    async function loadProduct() {
        if (!productId) {
            container.innerHTML = `
                <div class="error">
                    <h2>Product not found</h2>
                    <p>No product was selected.</p>
                    <br>
                    <a href="shop.html">Return to Shop</a>
                </div>
            `;
            return;
        }

        const { data, error } = await supabaseClient
            .from("products")
            .select("*")
            .eq("id", productId)
            .single();

        if (error || !data) {
            console.error("Product error:", error);

            container.innerHTML = `
                <div class="error">
                    <h2>Product not found</h2>
                    <p>We could not load this product.</p>
                    <br>
                    <a href="shop.html">Return to Shop</a>
                </div>
            `;
            return;
        }

        product = data;

        if (product.stock <= 0) {
            quantity = 0;
        }

        renderProduct();

        await checkWishlist();
    }

    async function checkWishlist() {
        if (!currentUser || !product) {
            return;
        }

        const { data, error } = await supabaseClient
            .from("wishlist")
            .select("id")
            .eq("user_id", currentUser.id)
            .eq("product_id", product.id)
            .maybeSingle();

        if (error) {
            console.error("Wishlist check error:", error);
            return;
        }

        isInWishlist = !!data;

        const wishlistButton = document.getElementById("wishlistButton");

        if (wishlistButton) {
            wishlistButton.textContent =
                isInWishlist ? "♥ Remove Wishlist" : "♡ Add to Wishlist";
        }
    }

    function renderProduct() {
        const rating = Number(product.rating || 0).toFixed(1);
        const reviewCount = Number(product.review_count || 0);

        const price = Number(product.price || 0).toLocaleString();
        const oldPrice = product.old_price
            ? Number(product.old_price).toLocaleString()
            : "";

        const stockText = product.stock > 0
            ? `${product.stock} items available`
            : "Out of stock";

        const badge = product.badge
            ? `<span style="
                display:inline-block;
                background:#f68b1e;
                color:white;
                padding:6px 10px;
                border-radius:4px;
                margin-bottom:15px;
                font-size:13px;
              ">${escapeHtml(product.badge)}</span>`
            : "";

        container.innerHTML = `
            <div class="product-box">

                <div class="image-section">
                    <img
                        src="${escapeAttribute(product.image_url || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80')}"
                        alt="${escapeAttribute(product.name)}"
                    >
                </div>

                <div class="details">

                    ${badge}

                    <h1>${escapeHtml(product.name)}</h1>

                    <div class="category">
                        Category: ${escapeHtml(product.category)}
                    </div>

                    <div class="rating">
                        ★ ${rating}
                        <span style="color:#777;">
                            (${reviewCount} reviews)
                        </span>
                    </div>

                    <div class="price">
                        KSh ${price}
                    </div>

                    ${
                        oldPrice
                        ? `<div class="old-price">KSh ${oldPrice}</div>`
                        : ""
                    }

                    <div class="stock">
                        ${stockText}
                    </div>

                    <div class="description">
                        ${
                            product.description
                            ? escapeHtml(product.description)
                            : "Quality product available from Meteur Online Shopping."
                        }
                    </div>

                    ${
                        product.stock > 0
                        ? `
                            <div class="quantity-box">
                                <button onclick="decreaseQuantity()">−</button>
                                <span id="quantity">1</span>
                                <button onclick="increaseQuantity()">+</button>
                            </div>
                        `
                        : ""
                    }

                    <div class="buttons">

                        <button
                            class="btn cart-btn"
                            id="addCartButton"
                            onclick="addToCart()"
                            ${product.stock <= 0 ? "disabled" : ""}
                        >
                            Add to Cart
                        </button>

                        <button
                            class="btn buy-btn"
                            id="buyButton"
                            onclick="buyNow()"
                            ${product.stock <= 0 ? "disabled" : ""}
                        >
                            Buy Now
                        </button>

                        <button
                            class="btn wishlist-btn"
                            id="wishlistButton"
                            onclick="toggleWishlist()"
                        >
                            ♡ Add to Wishlist
                        </button>

                    </div>

                    <div id="message" class="message"></div>

                </div>
            </div>
        `;
    }

    function increaseQuantity() {
        if (!product || product.stock <= 0) {
            return;
        }

        if (quantity < product.stock) {
            quantity++;
            updateQuantityDisplay();
        }
    }

    function decreaseQuantity() {
        if (quantity > 1) {
            quantity--;
            updateQuantityDisplay();
        }
    }

    function updateQuantityDisplay() {
        const quantityElement = document.getElementById("quantity");

        if (quantityElement) {
            quantityElement.textContent = quantity;
        }
    }

    async function addToCart() {
        if (!product || product.stock <= 0) {
            showMessage("This product is out of stock.", true);
            return;
        }

        currentUser = await getCurrentUser();

        if (!currentUser) {
            const redirectUrl =
                `product.html?id=${encodeURIComponent(product.id)}`;

            window.location.href =
                `login.html?redirect=${encodeURIComponent(redirectUrl)}`;

            return;
        }

        const button = document.getElementById("addCartButton");

        if (button) {
            button.disabled = true;
            button.textContent = "Adding...";
        }

        try {
            const {
                data: existing,
                error: existingError
            } = await supabaseClient
                .from("cart_items")
                .select("id, quantity")
                .eq("user_id", currentUser.id)
                .eq("product_id", product.id)
                .maybeSingle();

            if (existingError) {
                throw existingError;
            }

            const existingQuantity = existing
                ? Number(existing.quantity)
                : 0;

            const newQuantity = existingQuantity + quantity;

            if (newQuantity > product.stock) {
                showMessage(
                    `Only ${product.stock} item(s) are available.`,
                    true
                );

                if (button) {
                    button.disabled = false;
                    button.textContent = "Add to Cart";
                }

                return;
            }

            if (existing) {

                const { error: updateError } = await supabaseClient
                    .from("cart_items")
                    .update({
                        quantity: newQuantity,
                        updated_at: new Date().toISOString()
                    })
                    .eq("id", existing.id)
                    .eq("user_id", currentUser.id);

                if (updateError) {
                    throw updateError;
                }

            } else {

                const { error: insertError } = await supabaseClient
                    .from("cart_items")
                    .insert({
                        user_id: currentUser.id,
                        product_id: product.id,
                        quantity: quantity
                    });

                if (insertError) {
                    throw insertError;
                }
            }

            showMessage(
                `${quantity} item(s) added to your cart.`,
                false
            );

        } catch (error) {

            console.error("Add to cart error:", error);

            showMessage(
                "Could not add this product to your cart. Please try again.",
                true
            );

        } finally {

            if (button) {
                button.disabled = false;
                button.textContent = "Add to Cart";
            }
        }
    }

    async function buyNow() {
        if (!product || product.stock <= 0) {
            showMessage("This product is out of stock.", true);
            return;
        }

        currentUser = await getCurrentUser();

        if (!currentUser) {
            const redirectUrl =
                `product.html?id=${encodeURIComponent(product.id)}`;

            window.location.href =
                `login.html?redirect=${encodeURIComponent(redirectUrl)}`;

            return;
        }

        const button = document.getElementById("buyButton");

        if (button) {
            button.disabled = true;
            button.textContent = "Preparing...";
        }

        try {

            const {
                data: existing,
                error: existingError
            } = await supabaseClient
                .from("cart_items")
                .select("id, quantity")
                .eq("user_id", currentUser.id)
                .eq("product_id", product.id)
                .maybeSingle();

            if (existingError) {
                throw existingError;
            }

            const existingQuantity = existing
                ? Number(existing.quantity)
                : 0;

            const newQuantity = existingQuantity + quantity;

            if (newQuantity > product.stock) {
                showMessage(
                    `Only ${product.stock} item(s) are available.`,
                    true
                );

                if (button) {
                    button.disabled = false;
                    button.textContent = "Buy Now";
                }

                return;
            }

            if (existing) {

                const { error: updateError } = await supabaseClient
                    .from("cart_items")
                    .update({
                        quantity: newQuantity,
                        updated_at: new Date().toISOString()
                    })
                    .eq("id", existing.id)
                    .eq("user_id", currentUser.id);

                if (updateError) {
                    throw updateError;
                }

            } else {

                const { error: insertError } = await supabaseClient
                    .from("cart_items")
                    .insert({
                        user_id: currentUser.id,
                        product_id: product.id,
                        quantity: quantity
                    });

                if (insertError) {
                    throw insertError;
                }
            }

            window.location.href = "checkout.html";

        } catch (error) {

            console.error("Buy now error:", error);

            showMessage(
                "Could not prepare checkout. Please try again.",
                true
            );

            if (button) {
                button.disabled = false;
                button.textContent = "Buy Now";
            }
        }
    }

    async function toggleWishlist() {
        if (!product) {
            return;
        }

        currentUser = await getCurrentUser();

        if (!currentUser) {
            const redirectUrl =
                `product.html?id=${encodeURIComponent(product.id)}`;

            window.location.href =
                `login.html?redirect=${encodeURIComponent(redirectUrl)}`;

            return;
        }

        const button = document.getElementById("wishlistButton");

        if (button) {
            button.disabled = true;
        }

        try {

            if (isInWishlist) {

                const { error } = await supabaseClient
                    .from("wishlist")
                    .delete()
                    .eq("user_id", currentUser.id)
                    .eq("product_id", product.id);

                if (error) {
                    throw error;
                }

                isInWishlist = false;

                if (button) {
                    button.textContent = "♡ Add to Wishlist";
                }

                showMessage("Removed from wishlist.", false);

            } else {

                const { error } = await supabaseClient
                    .from("wishlist")
                    .insert({
                        user_id: currentUser.id,
                        product_id: product.id
                    });

                if (error) {
                    throw error;
                }

                isInWishlist = true;

                if (button) {
                    button.textContent = "♥ Remove Wishlist";
                }

                showMessage("Added to wishlist.", false);
            }

        } catch (error) {

            console.error("Wishlist error:", error);

            showMessage(
                "Could not update your wishlist. Please try again.",
                true
            );

        } finally {

            if (button) {
                button.disabled = false;
            }
        }
    }

    function showMessage(message, isError) {
        const element = document.getElementById("message");

        if (!element) {
            return;
        }

        element.textContent = message;
        element.style.display = "block";

        if (isError) {
            element.style.background = "#ffe5e5";
            element.style.color = "#b00020";
        } else {
            element.style.background = "#e5f7e5";
            element.style.color = "#146b14";
        }

        setTimeout(() => {
            element.style.display = "none";
        }, 3000);
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
        return escapeHtml(value);
    }

    document.getElementById("searchForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const search = document.getElementById("searchInput").value.trim();

        if (search) {
            window.location.href =
                `shop.html?search=${encodeURIComponent(search)}`;
        } else {
            window.location.href = "shop.html";
        }
    });

    async function initialize() {
        currentUser = await getCurrentUser();
        await loadProduct();
    }

    initialize();
</script>

</body>
</html>
