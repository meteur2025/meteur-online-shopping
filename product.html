<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product - Meteur Online Shopping</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #f97316;
            color: white;
            padding: 18px 5%;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .breadcrumb {
            margin-bottom: 20px;
            color: #666;
        }

        .breadcrumb a {
            color: #f97316;
            text-decoration: none;
        }

        .product {
            background: white;
            border-radius: 14px;
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 12px;
        }

        .category {
            color: #f97316;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .rating {
            color: #666;
            margin-bottom: 20px;
        }

        .stars {
            color: #f59e0b;
            font-size: 18px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            color: #111;
            margin-bottom: 5px;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 17px;
            margin-left: 10px;
            font-weight: normal;
        }

        .saving {
            color: #16a34a;
            font-weight: bold;
            margin: 10px 0 20px;
        }

        .stock {
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 20px;
        }

        .out-stock {
            color: #dc2626;
        }

        .description {
            color: #555;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .quantity-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quantity-area button {
            width: 38px;
            height: 38px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 6px;
            font-size: 20px;
        }

        .quantity {
            min-width: 35px;
            text-align: center;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .cart-button {
            background: #f97316;
            color: white;
        }

        .buy-button {
            background: #111;
            color: white;
        }

        .wishlist-button {
            background: white;
            color: #f97316;
            border: 2px solid #f97316;
        }

        .wishlist-button.active {
            background: #fff7ed;
        }

        .button:disabled {
            background: #aaa;
            border-color: #aaa;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            background: white;
            padding: 60px;
            text-align: center;
            border-radius: 12px;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 40px;
        }

        @media (max-width: 800px) {
            .product {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 350px;
            }

            h1 {
                font-size: 25px;
            }
        }

        @media (max-width: 500px) {
            .product {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            Meteur Online Shopping
        </div>

        <div class="nav">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="cart.html">Cart</a>
            <a href="dashboard.html">Account</a>
        </div>

    </div>
</header>

<div class="container">

    <div class="breadcrumb">
        <a href="shop.html">Shop</a>
        <span> / Product</span>
    </div>

    <div id="message" class="message"></div>

    <div id="productContainer">
        <div class="loading">
            Loading product...
        </div>
    </div>

</div>

<footer>
    <p>© 2026 Meteur Online Shopping. All rights reserved.</p>
</footer>

<script>

    let product = null;
    let currentUser = null;
    let quantity = 1;
    let isInWishlist = false;

    const productContainer =
        document.getElementById("productContainer");

    const messageBox =
        document.getElementById("message");

    function formatMoney(amount) {

        return "KSh " +
            Number(amount || 0).toLocaleString("en-KE", {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });

    }

    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value == null ? "" : String(value);

        return div.innerHTML;

    }

    function renderStars(rating) {

        const rounded =
            Math.round(Number(rating) || 0);

        return "★".repeat(rounded) +
            "☆".repeat(5 - rounded);

    }

    function showMessage(message, type) {

        messageBox.textContent =
            message;

        messageBox.className =
            "message " + type;

        messageBox.style.display =
            "block";

        setTimeout(() => {

            messageBox.style.display =
                "none";

        }, 3000);

    }

    function getCart() {

        try {

            const cart =
                JSON.parse(
                    localStorage.getItem("meteurCart") || "[]"
                );

            return Array.isArray(cart)
                ? cart
                : [];

        } catch (error) {

            return [];

        }

    }

    function saveCart(cart) {

        localStorage.setItem(
            "meteurCart",
            JSON.stringify(cart)
        );

    }

    function addToCart() {

        if (!product) {
            return;
        }

        const stock =
            Number(product.stock) || 0;

        if (stock <= 0) {

            showMessage(
                "This product is out of stock.",
                "error"
            );

            return;
        }

        const cart =
            getCart();

        const existing =
            cart.find(
                item => item.id === product.id
            );

        if (existing) {

            const newQuantity =
                (Number(existing.quantity) || 1) +
                quantity;

            existing.quantity =
                Math.min(newQuantity, stock);

        } else {

            cart.push({

                id: product.id,

                name: product.name,

                price: Number(product.price),

                image: product.image_url,

                quantity: Math.min(quantity, stock)

            });

        }

        saveCart(cart);

        showMessage(
            "Product added to your cart.",
            "success"
        );

    }

    function buyNow() {

        if (!product) {
            return;
        }

        const stock =
            Number(product.stock) || 0;

        if (stock <= 0) {

            showMessage(
                "This product is out of stock.",
                "error"
            );

            return;
        }

        const cart =
            getCart();

        const existing =
            cart.find(
                item => item.id === product.id
            );

        if (existing) {

            existing.quantity =
                Math.min(
                    (Number(existing.quantity) || 1) + quantity,
                    stock
                );

        } else {

            cart.push({

                id: product.id,

                name: product.name,

                price: Number(product.price),

                image: product.image_url,

                quantity:
                    Math.min(quantity, stock)

            });

        }

        saveCart(cart);

        window.location.href =
            "checkout.html";

    }

    async function checkWishlist() {

        if (!currentUser || !product) {
            return;
        }

        const {
            data,
            error
        } = await supabaseClient
            .from("wishlist")
            .select("id")
            .eq("user_id", currentUser.id)
            .eq("product_id", product.id)
            .maybeSingle();

        if (error) {

            console.error(
                "Wishlist check error:",
                error
            );

            return;
        }

        isInWishlist =
            Boolean(data);

        updateWishlistButton();

    }

    function updateWishlistButton() {

        const button =
            document.getElementById("wishlistButton");

        if (!button) {
            return;
        }

        if (isInWishlist) {

            button.textContent =
                "♥ Saved to Wishlist";

            button.classList.add("active");

        } else {

            button.textContent =
                "♡ Add to Wishlist";

            button.classList.remove("active");

        }

    }

    async function toggleWishlist() {

        if (!currentUser) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    "product.html?id=" + product.id
                );

            return;
        }

        if (!product) {
            return;
        }

        const button =
            document.getElementById("wishlistButton");

        button.disabled = true;

        if (isInWishlist) {

            const {
                error
            } = await supabaseClient
                .from("wishlist")
                .delete()
                .eq("user_id", currentUser.id)
                .eq("product_id", product.id);

            if (error) {

                console.error(
                    "Wishlist removal error:",
                    error
                );

                showMessage(
                    "Could not remove the product from your wishlist.",
                    "error"
                );

                button.disabled = false;

                return;
            }

            isInWishlist = false;

            showMessage(
                "Product removed from your wishlist.",
                "success"
            );

        } else {

            const {
                error
            } = await supabaseClient
                .from("wishlist")
                .insert([{
                    user_id: currentUser.id,
                    product_id: product.id
                }]);

            if (error) {

                if (error.code === "23505") {

                    isInWishlist = true;

                } else {

                    console.error(
                        "Wishlist insert error:",
                        error
                    );

                    showMessage(
                        "Could not add the product to your wishlist.",
                        "error"
                    );

                    button.disabled = false;

                    return;
                }

            } else {

                isInWishlist = true;

            }

            showMessage(
                "Product saved to your wishlist.",
                "success"
            );

        }

        updateWishlistButton();

        button.disabled = false;

    }

    function changeQuantity(amount) {

        if (!product) {
            return;
        }

        const stock =
            Number(product.stock) || 0;

        quantity += amount;

        if (quantity < 1) {
            quantity = 1;
        }

        if (stock > 0 && quantity > stock) {
            quantity = stock;
        }

        const quantityDisplay =
            document.getElementById("quantity");

        if (quantityDisplay) {

            quantityDisplay.textContent =
                quantity;

        }

    }

    function renderProduct() {

        const stock =
            Number(product.stock) || 0;

        const savings =
            product.old_price &&
            Number(product.old_price) > Number(product.price)
                ? Number(product.old_price) -
                  Number(product.price)
                : 0;

        productContainer.innerHTML = `

            <div class="product">

                <div>

                    <img
                        class="product-image"
                        src="${escapeHTML(
                            product.image_url ||
                            "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800"
                        )}"
                        alt="${escapeHTML(product.name)}"
                    >

                </div>

                <div>

                    <div class="category">
                        ${escapeHTML(product.category)}
                    </div>

                    <h1>
                        ${escapeHTML(product.name)}
                    </h1>

                    <div class="rating">

                        <span class="stars">
                            ${renderStars(product.rating)}
                        </span>

                        ${Number(product.rating || 0).toFixed(1)}

                        ·

                        ${Number(product.review_count || 0)}
                        reviews

                    </div>

                    <div class="price">

                        ${formatMoney(product.price)}

                        ${
                            product.old_price
                            ? `
                                <span class="old-price">
                                    ${formatMoney(product.old_price)}
                                </span>
                            `
                            : ""
                        }

                    </div>

                    ${
                        savings > 0
                        ? `
                            <div class="saving">
                                Save ${formatMoney(savings)}
                            </div>
                        `
                        : ""
                    }

                    <div class="${
                        stock > 0
                            ? "stock"
                            : "stock out-stock"
                    }">

                        ${
                            stock > 0
                                ? `${stock} items available`
                                : "Out of stock"
                        }

                    </div>

                    <p class="description">

                        ${
                            escapeHTML(
                                product.description ||
                                "No description is currently available for this product."
                            )
                        }

                    </p>

                    ${
                        stock > 0
                        ? `
                            <div class="quantity-area">

                                <button
                                    type="button"
                                    id="minusButton"
                                >
                                    −
                                </button>

                                <span
                                    class="quantity"
                                    id="quantity"
                                >
                                    1
                                </span>

                                <button
                                    type="button"
                                    id="plusButton"
                                >
                                    +
                                </button>

                            </div>
                        `
                        : ""
                    }

                    <div class="actions">

                        <button
                            type="button"
                            class="button wishlist-button"
                            id="wishlistButton"
                        >
                            ♡ Add to Wishlist
                        </button>

                        <button
                            type="button"
                            class="button cart-button"
                            id="cartButton"
                            ${stock <= 0 ? "disabled" : ""}
                        >
                            Add to Cart
                        </button>

                        <button
                            type="button"
                            class="button buy-button"
                            id="buyButton"
                            ${stock <= 0 ? "disabled" : ""}
                        >
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

        `;

        document
            .getElementById("wishlistButton")
            .addEventListener(
                "click",
                toggleWishlist
            );

        if (stock > 0) {

            document
                .getElementById("minusButton")
                .addEventListener(
                    "click",
                    () => changeQuantity(-1)
                );

            document
                .getElementById("plusButton")
                .addEventListener(
                    "click",
                    () => changeQuantity(1)
                );

            document
                .getElementById("cartButton")
                .addEventListener(
                    "click",
                    addToCart
                );

            document
                .getElementById("buyButton")
                .addEventListener(
                    "click",
                    buyNow
                );

        }

        updateWishlistButton();

    }

    async function loadProduct() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const productId =
            params.get("id");

        if (!productId) {

            productContainer.innerHTML = `
                <div class="loading">
                    Product not found.
                    <br><br>
                    <a href="shop.html">
                        Return to Shop
                    </a>
                </div>
            `;

            return;

        }

        const {
            data,
            error
        } = await supabaseClient
            .from("products")
            .select("*")
            .eq("id", productId)
            .single();

        if (error || !data) {

            console.error(
                "Product loading error:",
                error
            );

            productContainer.innerHTML = `
                <div class="loading">
                    We could not load this product.
                    <br><br>
                    <a href="shop.html">
                        Return to Shop
                    </a>
                </div>
            `;

            return;

        }

        product =
            data;

        renderProduct();

        await checkWishlist();

    }

    async function loadUser() {

        const {
            data
        } = await supabaseClient.auth.getUser();

        if (data && data.user) {

            currentUser =
                data.user;

        }

    }

    async function initialize() {

        await loadUser();

        await loadProduct();

    }

    initialize();

</script>

</body>
</html>
