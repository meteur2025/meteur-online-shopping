<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Meteur Online Shopping</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #222;
        }

        header {
            background: #ff7900;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 26px;
            font-weight: bold;
        }

        .login-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            min-height: calc(100vh - 150px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-box {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ff7900;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #ff7900;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e86d00;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            display: none;
            line-height: 1.5;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
        }

        .success {
            background: #e7f7ed;
            color: #176b36;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .bottom-text a {
            color: #ff7900;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">Meteur</a>
    <a href="login.html" class="login-link">Login</a>
</header>

<main>
    <div class="register-box">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your Meteur Online Shopping account.
        </p>

        <form id="registerForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="6"
                required
            >

            <button type="submit" id="registerButton">
                Create Account
            </button>

        </form>

        <div id="message" class="message"></div>

        <p class="bottom-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>
</main>

<footer>
    © 2026 Meteur Online Shopping. All rights reserved.
</footer>

<script>
    const SUPABASE_URL = "https://nytsdeupaootukcullgi.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_cIqzHoafy_AEdB48KS_Wpg_LDqE1sFC";

    const { createClient } = supabase;

    const supabaseClient = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    const registerForm = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
        message.style.display = "block";
    }

    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (!name) {
            showMessage("Please enter your full name.", "error");
            return;
        }

        if (password.length < 6) {
            showMessage(
                "Password must be at least 6 characters long.",
                "error"
            );
            return;
        }

        if (password !== confirmPassword) {
            showMessage(
                "Passwords do not match.",
                "error"
            );
            return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "Creating Account...";
        message.style.display = "none";

        try {
            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            name: name
                        },
                        emailRedirectTo:
                            window.location.origin + "/verify-email.html"
                    }
                });

            if (error) {
                console.error("Supabase registration error:", error);
                showMessage(error.message, "error");

                registerButton.disabled = false;
                registerButton.textContent = "Create Account";
                return;
            }

            showMessage(
                "Account created successfully. Please check your email to verify your account.",
                "success"
            );

            registerForm.reset();

            setTimeout(function() {
                window.location.href = "verify-email.html";
            }, 2000);

        } catch (error) {
            console.error("Registration error:", error);

            showMessage(
                "Unable to create your account. Please try again.",
                "error"
            );

            registerButton.disabled = false;
            registerButton.textContent = "Create Account";
        }
    });
</script>

</body>
</html>
