<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Meteur Online Shopping</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Meteur Supabase Configuration -->
    <script src="supabase-config.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="index.html">Meteur Online Shopping</a>
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="cart.html">Cart</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-container">

                <div class="auth-card">

                    <div class="auth-header">
                        <h1>Create Your Account</h1>
                        <p>Join Meteur Online Shopping and start shopping today.</p>
                    </div>

                    <div id="message" class="auth-message"></div>

                    <form id="registerForm">

                        <div class="form-row">

                            <div class="form-group">
                                <label for="firstName">First Name</label>
                                <input
                                    type="text"
                                    id="firstName"
                                    placeholder="First name"
                                    required
                                    autocomplete="given-name"
                                >
                            </div>

                            <div class="form-group">
                                <label for="lastName">Last Name</label>
                                <input
                                    type="text"
                                    id="lastName"
                                    placeholder="Last name"
                                    required
                                    autocomplete="family-name"
                                >
                            </div>

                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required
                                autocomplete="email"
                            >
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input
                                type="tel"
                                id="phone"
                                placeholder="e.g. 0712345678"
                                required
                                autocomplete="tel"
                            >
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >
                            <small>Password must be at least 6 characters.</small>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >
                        </div>

                        <div class="terms-row">
                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            <label for="terms">
                                I agree to the
                                <a href="terms.html" target="_blank">
                                    Terms and Conditions
                                </a>
                                and
                                <a href="privacy.html" target="_blank">
                                    Privacy Policy
                                </a>.
                            </label>
                        </div>

                        <button
                            type="submit"
                            id="registerButton"
                            class="auth-button"
                        >
                            Create Account
                        </button>

                    </form>

                    <div class="auth-divider">
                        <span>OR</span>
                    </div>

                    <div class="login-link">
                        <p>
                            Already have an account?
                            <a href="login.html">Login here</a>
                        </p>
                    </div>

                    <div class="back-home">
                        <a href="index.html">← Back to shopping</a>
                    </div>

                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Meteur Online Shopping. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const registerForm = document.getElementById("registerForm");
        const registerButton = document.getElementById("registerButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "auth-message " + type;
        }

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const firstName =
                document.getElementById("firstName").value.trim();

            const lastName =
                document.getElementById("lastName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const terms =
                document.getElementById("terms").checked;

            if (!firstName || !lastName || !email || !phone) {
                showMessage(
                    "Please complete all required fields.",
                    "error"
                );
                return;
            }

            if (password.length < 6) {
                showMessage(
                    "Password must be at least 6 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "Passwords do not match.",
                    "error"
                );
                return;
            }

            if (!terms) {
                showMessage(
                    "Please accept the Terms and Conditions and Privacy Policy.",
                    "error"
                );
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = "Creating account...";

            showMessage(
                "Creating your account...",
                "info"
            );

            try {

                const { data, error } =
                    await supabaseClient.auth.signUp({
                        email: email,
                        password: password,

                        options: {
                            emailRedirectTo:
                                "https://meteur-online-shopping.vercel.app/verify-email.html",

                            data: {
                                first_name: firstName,
                                last_name: lastName,
                                phone: phone
                            }
                        }
                    });

                if (error) {
                    throw error;
                }

                localStorage.setItem(
                    "meteurVerificationEmail",
                    email
                );

                showMessage(
                    "Account created successfully. Please check your email and confirm your email address.",
                    "success"
                );

                registerButton.textContent =
                    "Account Created";

                setTimeout(function() {
                    window.location.href =
                        "verify-email.html";
                }, 2500);

            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );

                let errorMessage =
                    "Unable to create your account. Please try again.";

                if (error.message) {

                    const errorText =
                        error.message.toLowerCase();

                    if (
                        errorText.includes("already registered") ||
                        errorText.includes("already been registered")
                    ) {
                        errorMessage =
                            "An account with this email already exists. Please log in instead.";
                    } else if (
                        errorText.includes("password")
                    ) {
                        errorMessage =
                            error.message;
                    } else if (
                        errorText.includes("invalid")
                    ) {
                        errorMessage =
                            error.message;
                    } else {
                        errorMessage =
                            error.message;
                    }
                }

                showMessage(
                    errorMessage,
                    "error"
                );

                registerButton.disabled = false;
                registerButton.textContent =
                    "Create Account";
            }
        });
    </script>

    <style>

        .auth-section {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background: #f7f7f7;
        }

        .auth-container {
            width: 100%;
            max-width: 600px;
        }

        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #666;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f68b1e;
        }

        .form-group small {
            display: block;
            margin-top: 6px;
            color: #777;
            font-size: 13px;
        }

        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
        }

        .terms-row input {
            margin-top: 4px;
        }

        .terms-row a,
        .login-link a,
        .back-home a {
            color: #f68b1e;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #f68b1e;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-button:hover {
            opacity: 0.9;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
        }

        .auth-message.error,
        .auth-message.success,
        .auth-message.info {
            display: block;
        }

        .auth-message.error {
            background: #ffe5e5;
            color: #b00020;
        }

        .auth-message.success {
            background: #e5f7e9;
            color: #187a32;
        }

        .auth-message.info {
            background: #e8f1ff;
            color: #245ea8;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            color: #999;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .login-link,
        .back-home {
            text-align: center;
        }

        .back-home {
            margin-top: 20px;
        }

        @media (max-width: 600px) {

            .auth-card {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>

</body>
</html>
