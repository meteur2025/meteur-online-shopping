<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Meteur Online Shopping</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #f4511e;
      color: white;
      padding: 18px 30px;
    }

    header h1 {
      font-size: 24px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-bottom: 8px;
      color: #222;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #f4511e;
    }

    button {
      width: 100%;
      border: none;
      background: #f4511e;
      color: white;
      padding: 13px;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d84315;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      line-height: 1.5;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #e8f5e9;
      color: #1b5e20;
    }

    .error {
      display: block;
      background: #ffebee;
      color: #b00020;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .login-link a {
      color: #f4511e;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 500px) {
      header {
        padding: 16px 18px;
      }

      header h1 {
        font-size: 20px;
      }

      .container {
        margin: 25px auto;
        padding: 0 14px;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Meteur Online Shopping</h1>
</header>

<div class="container">

  <div class="card">

    <h2>Create Your Account</h2>

    <p class="subtitle">
      Register as a customer to shop, place orders, save products, and manage your account.
    </p>

    <form id="registerForm">

      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <button type="submit" id="registerBtn">
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

</div>

<script>
  const SUPABASE_URL = "https://nytsdeupaootukcullgi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_cIqzHoafy_AEdB48KS_Wpg_LDqE1sFC";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const registerForm = document.getElementById("registerForm");
  const registerBtn = document.getElementById("registerBtn");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  registerForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!fullName) {
      showMessage("Please enter your full name.", "error");
      return;
    }

    if (!email) {
      showMessage("Please enter your email address.", "error");
      return;
    }

    if (password.length < 6) {
      showMessage("Password must be at least 6 characters.", "error");
      return;
    }

    if (password !== confirmPassword) {
      showMessage("Passwords do not match.", "error");
      return;
    }

    registerBtn.disabled = true;
    registerBtn.textContent = "Creating Account...";

    showMessage("", "success");

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName,
            name: fullName
          }
        }
      });

      if (error) {
        throw error;
      }

      if (!data || !data.user) {
        throw new Error("Account creation failed. Please try again.");
      }

      sessionStorage.setItem("meteurVerificationEmail", email);

      window.location.href =
        "verify-email.html?email=" + encodeURIComponent(email);

    } catch (error) {
      console.error("Registration error:", error);

      showMessage(
        error.message || "Unable to create your account. Please try again.",
        "error"
      );

      registerBtn.disabled = false;
      registerBtn.textContent = "Create Account";
    }
  });
</script>

</body>
</html>
