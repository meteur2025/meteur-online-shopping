<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Meteur Online Shopping</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Meteur Supabase Configuration -->
    <script src="supabase-config.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="container">

            <div class="logo">
                <a href="index.html">
                    Meteur Online Shopping
                </a>
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="cart.html">Cart</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="auth-section">

            <div class="auth-container">

                <div class="auth-card">

                    <div class="auth-header">

                        <div class="lock-icon">
                            🔐
                        </div>

                        <h1>Reset Your Password</h1>

                        <p>
                            Create a new secure password for your
                            Meteur Online Shopping account.
                        </p>

                    </div>

                    <div
                        id="message"
                        class="auth-message"
                    ></div>

                    <form id="resetPasswordForm">

                        <div class="form-group">

                            <label for="password">
                                New Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your new password"
                                minlength="6"
                                required
                                autocomplete="new-password"
                            >

                            <small>
                                Password must be at least 6 characters.
                            </small>

                        </div>

                        <div class="form-group">

                            <label for="confirmPassword">
                                Confirm New Password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your new password"
                                minlength="6"
                                required
                                autocomplete="new-password"
                            >

                        </div>

                        <button
                            type="submit"
                            id="resetButton"
                            class="auth-button"
                        >
                            Update Password
                        </button>

                    </form>

                    <div class="login-link">

                        <p>
                            Remember your password?
                            <a href="login.html">
                                Go to Login
                            </a>
                        </p>

                    </div>

                    <div class="back-home">

                        <a href="index.html">
                            ← Back to shopping
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 Meteur Online Shopping.
                All rights reserved.
            </p>

        </div>

    </footer>

    <script>

        const resetForm =
            document.getElementById("resetPasswordForm");

        const resetButton =
            document.getElementById("resetButton");

        const message =
            document.getElementById("message");

        let recoverySessionReady = false;

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "auth-message " + type;

        }

        async function preparePasswordReset() {

            try {

                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) {
                    throw error;
                }

                if (data.session) {

                    recoverySessionReady = true;

                    return;

                }

                showMessage(
                    "This password reset link is invalid or has expired. Please request a new reset link.",
                    "error"
                );

                resetButton.disabled = true;

            } catch (error) {

                console.error(
                    "Password reset session error:",
                    error
                );

                showMessage(
                    "Unable to verify this password reset link. Please request a new one.",
                    "error"
                );

                resetButton.disabled = true;

            }

        }

        resetForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                if (!recoverySessionReady) {

                    showMessage(
                        "Your password reset session is not ready. Please request a new reset link.",
                        "error"
                    );

                    return;

                }

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (password.length < 6) {

                    showMessage(
                        "Password must be at least 6 characters.",
                        "error"
                    );

                    return;

                }

                if (password !== confirmPassword) {

                    showMessage(
                        "The passwords do not match.",
                        "error"
                    );

                    return;

                }

                resetButton.disabled = true;

                resetButton.textContent =
                    "Updating...";

                showMessage(
                    "Updating your password...",
                    "info"
                );

                try {

                    const { error } =
                        await supabaseClient.auth.updateUser({
                            password: password
                        });

                    if (error) {
                        throw error;
                    }

                    showMessage(
                        "Your password has been updated successfully. Redirecting you to login...",
                        "success"
                    );

                    resetForm.reset();

                    await supabaseClient.auth.signOut();

                    setTimeout(function() {

                        window.location.href =
                            "login.html";

                    }, 2500);

                } catch (error) {

                    console.error(
                        "Password update error:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Unable to update your password. Please try again.",
                        "error"
                    );

                    resetButton.disabled = false;

                    resetButton.textContent =
                        "Update Password";

                }

            }
        );

        /*
         * Supabase may create the recovery session from
         * the password-reset link automatically.
         * This listener also handles recovery events.
         */

        supabaseClient.auth.onAuthStateChange(
            function(event, session) {

                if (
                    event === "PASSWORD_RECOVERY" &&
                    session
                ) {

                    recoverySessionReady = true;

                    resetButton.disabled = false;

                    showMessage(
                        "Password reset verified. You can now create a new password.",
                        "success"
                    );

                }

            }
        );

        preparePasswordReset();

    </script>

    <style>

        .auth-section {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background: #f7f7f7;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
        }

        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .lock-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fff1e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .auth-header h1 {
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #666;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f68b1e;
        }

        .form-group small {
            display: block;
            margin-top: 6px;
            color: #777;
            font-size: 13px;
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #f68b1e;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-button:hover {
            opacity: 0.9;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
            line-height: 1.5;
        }

        .auth-message.error,
        .auth-message.success,
        .auth-message.info {
            display: block;
        }

        .auth-message.error {
            background: #ffe5e5;
            color: #b00020;
        }

        .auth-message.success {
            background: #e5f7e9;
            color: #187a32;
        }

        .auth-message.info {
            background: #e8f1ff;
            color: #245ea8;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
        }

        .login-link a,
        .back-home a {
            color: #f68b1e;
            text-decoration: none;
            font-weight: 600;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 600px) {

            .auth-card {
                padding: 25px;
            }

        }

    </style>

</body>
</html>
