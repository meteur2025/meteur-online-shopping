<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Dashboard | Meteur Online Shopping</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        header {
            background: #f97316;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-actions a,
        .logout-btn {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.7);
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        main {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        .status-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .store-name {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .status {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background: #fff7ed;
            color: #c2410c;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .stat-card h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: bold;
            color: #f97316;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 22px rgba(0,0,0,0.1);
        }

        .action-icon {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .action-card h2 {
            font-size: 19px;
            margin-bottom: 7px;
        }

        .action-card p {
            color: #666;
            line-height: 1.5;
            font-size: 14px;
        }

        .info-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .info-card h2 {
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 13px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #777;
        }

        .info-value {
            font-weight: bold;
            text-align: right;
        }

        .message {
            background: white;
            padding: 30px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .message h2 {
            margin-bottom: 10px;
        }

        .message p {
            color: #666;
            line-height: 1.6;
        }

        .error {
            color: #b91c1c;
        }

        @media (max-width: 800px) {

            .stats,
            .actions {
                grid-template-columns: 1fr;
            }

            .status-row {
                flex-direction: column;
                align-items: flex-start;
            }

            header {
                padding: 16px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .header-actions {
                gap: 8px;
            }

            .header-actions a {
                display: none;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">Meteur Seller</div>

    <div class="header-actions">
        <a href="index.html">Shopping</a>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

</header>

<main>

    <section class="welcome">
        <h1>Seller Dashboard</h1>
        <p>Manage your Meteur Online Shopping seller account.</p>
    </section>

    <div id="pageContent">

        <div class="message">
            <h2>Loading seller account...</h2>
            <p>Please wait.</p>
        </div>

    </div>

</main>

<script>

    const pageContent =
        document.getElementById("pageContent");

    const logoutBtn =
        document.getElementById("logoutBtn");

    async function loadDashboard() {

        try {

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();

            if (userError || !user) {

                window.location.href =
                    "login.html?redirect=seller-dashboard.html";

                return;
            }

            const {
                data: seller,
                error: sellerError
            } = await supabaseClient
                .from("sellers")
                .select("*")
                .eq("user_id", user.id)
                .maybeSingle();

            if (sellerError) {
                throw sellerError;
            }

            if (!seller) {

                pageContent.innerHTML = `
                    <div class="message">
                        <h2>Seller account not found</h2>
                        <p>
                            You have not submitted a seller application yet.
                        </p>
                        <br>
                        <a href="seller-register.html"
                           style="color:#f97316;font-weight:bold;text-decoration:none;">
                            Apply to become a seller
                        </a>
                    </div>
                `;

                return;
            }

            let productCount = 0;
            let orderCount = 0;

            const {
                count: productsCount,
                error: productsError
            } = await supabaseClient
                .from("products")
                .select("*", {
                    count: "exact",
                    head: true
                });

            if (!productsError) {
                productCount = productsCount || 0;
            }

            const {
                count: ordersCount,
                error: ordersError
            } = await supabaseClient
                .from("orders")
                .select("*", {
                    count: "exact",
                    head: true
                });

            if (!ordersError) {
                orderCount = ordersCount || 0;
            }

            pageContent.innerHTML = `

                <section class="status-card">

                    <div class="status-row">

                        <div>
                            <div class="store-name">
                                ${escapeHtml(seller.store_name)}
                            </div>

                            <p>
                                Seller account for
                                ${escapeHtml(seller.owner_name)}
                            </p>
                        </div>

                        <span class="status">
                            ${escapeHtml(seller.status)}
                        </span>

                    </div>

                </section>

                <section class="stats">

                    <div class="stat-card">
                        <h3>Marketplace Products</h3>
                        <div class="stat-value">
                            ${productCount}
                        </div>
                    </div>

                    <div class="stat-card">
                        <h3>Marketplace Orders</h3>
                        <div class="stat-value">
                            ${orderCount}
                        </div>
                    </div>

                    <div class="stat-card">
                        <h3>Seller Status</h3>
                        <div class="stat-value"
                             style="font-size:22px;">
                            ${escapeHtml(seller.status)}
                        </div>
                    </div>

                </section>

                <section class="actions">

                    <a href="seller-products.html"
                       class="action-card">

                        <div class="action-icon">📦</div>

                        <h2>My Products</h2>

                        <p>
                            Add, edit and manage products
                            for your store.
                        </p>

                    </a>

                    <a href="seller-orders.html"
                       class="action-card">

                        <div class="action-icon">🛍️</div>

                        <h2>My Orders</h2>

                        <p>
                            View and manage customer orders
                            for your products.
                        </p>

                    </a>

                    <a href="seller-register.html"
                       class="action-card">

                        <div class="action-icon">🏪</div>

                        <h2>Store Information</h2>

                        <p>
                            Review your seller application
                            and store information.
                        </p>

                    </a>

                </section>

                <section class="info-card">

                    <h2>Seller Information</h2>

                    <div class="info-row">
                        <span class="info-label">Store Name</span>
                        <span class="info-value">
                            ${escapeHtml(seller.store_name)}
                        </span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Owner</span>
                        <span class="info-value">
                            ${escapeHtml(seller.owner_name)}
                        </span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value">
                            ${escapeHtml(seller.email)}
                        </span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Phone</span>
                        <span class="info-value">
                            ${escapeHtml(seller.phone)}
                        </span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">County</span>
                        <span class="info-value">
                            ${escapeHtml(seller.county || "Not provided")}
                        </span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Town</span>
                        <span class="info-value">
                            ${escapeHtml(seller.town || "Not provided")}
                        </span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Application Status</span>
                        <span class="info-value">
                            ${escapeHtml(seller.status)}
                        </span>
                    </div>

                </section>
            `;

        } catch (error) {

            console.error("Seller dashboard error:", error);

            pageContent.innerHTML = `
                <div class="message">
                    <h2 class="error">
                        Unable to load seller dashboard
                    </h2>

                    <p>
                        ${escapeHtml(
                            error.message ||
                            "An unexpected error occurred."
                        )}
                    </p>
                </div>
            `;
        }
    }

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    logoutBtn.addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.href = "login.html";

    });

    loadDashboard();

</script>

</body>
</html>
