<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Orders - Meteur Online Shopping</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #f4511e;
            color: white;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .top-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .top-card h2 {
            margin-top: 0;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            background: #fff3e0;
            margin-bottom: 20px;
        }

        .orders {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            background: #fff3e0;
            color: #e65100;
            font-size: 13px;
            font-weight: bold;
        }

        .section {
            margin-top: 18px;
        }

        .section h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .customer-info,
        .payment-info {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 20px;
        }

        .info-item {
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
        }

        .info-item strong {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: #666;
        }

        .seller-items {
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: bold;
        }

        .item-details {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .item-price {
            font-weight: bold;
            white-space: nowrap;
        }

        .totals {
            margin-top: 15px;
            text-align: right;
        }

        .totals div {
            margin: 5px 0;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 35px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
            padding: 15px;
            border-radius: 8px;
        }

        @media (max-width: 700px) {
            .customer-info,
            .payment-info {
                grid-template-columns: 1fr;
            }

            .item {
                flex-direction: column;
            }

            .item-price {
                white-space: normal;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Meteur Online Shopping — Seller Orders</h1>
    <a href="seller-dashboard.html">Seller Dashboard</a>
</header>

<main>

    <div class="top-card">
        <h2>Orders</h2>
        <p>View orders containing products from your store.</p>
    </div>

    <div id="message" class="message">
        Loading your orders...
    </div>

    <div id="orders" class="orders"></div>

</main>

<script>
    const SUPABASE_URL = "https://nytsdeupaootukcullgi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_cIqzHoafy_AEdB48KS_Wpg_LDQE1sFC";

    const { createClient } = supabase;

    const db = createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const message = document.getElementById("message");
    const ordersContainer = document.getElementById("orders");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatMoney(value) {
        return `KSh ${Number(value || 0).toLocaleString()}`;
    }

    function formatDate(value) {
        if (!value) return "—";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return escapeHtml(value);
        }

        return date.toLocaleString("en-KE", {
            dateStyle: "medium",
            timeStyle: "short"
        });
    }

    async function loadSellerOrders() {
        try {
            const {
                data: {
                    user
                },
                error: userError
            } = await db.auth.getUser();

            if (userError) {
                throw userError;
            }

            if (!user) {
                window.location.href =
                    "login.html?redirect=seller-orders.html";
                return;
            }

            const {
                data: seller,
                error: sellerError
            } = await db
                .from("sellers")
                .select("id, store_name, status")
                .eq("user_id", user.id)
                .maybeSingle();

            if (sellerError) {
                throw sellerError;
            }

            if (!seller) {
                message.className = "error";
                message.textContent =
                    "Seller profile not found.";
                return;
            }

            if (seller.status !== "Approved") {
                message.className = "error";
                message.textContent =
                    "Your seller account must be approved before you can view seller orders.";
                return;
            }

            const {
                data: orders,
                error: ordersError
            } = await db.rpc("get_seller_orders");

            if (ordersError) {
                throw ordersError;
            }

            if (!orders || orders.length === 0) {
                message.style.display = "none";

                ordersContainer.innerHTML = `
                    <div class="empty">
                        <h3>No seller orders yet</h3>
                        <p>
                            Orders containing products from
                            <strong>${escapeHtml(seller.store_name)}</strong>
                            will appear here.
                        </p>
                    </div>
                `;

                return;
            }

            message.style.display = "none";

            ordersContainer.innerHTML = orders.map(order => {

                const items = Array.isArray(order.items)
                    ? order.items
                    : [];

                const sellerItems = items.filter(item =>
                    item &&
                    item.product_id
                );

                let sellerSubtotal = 0;

                const itemHtml = sellerItems.map(item => {

                    const quantity =
                        Number(item.quantity || 1);

                    const price =
                        Number(
                            item.price ??
                            item.unit_price ??
                            0
                        );

                    const lineTotal =
                        quantity * price;

                    sellerSubtotal += lineTotal;

                    return `
                        <div class="item">
                            <div>
                                <div class="item-name">
                                    ${escapeHtml(
                                        item.name ||
                                        item.product_name ||
                                        "Product"
                                    )}
                                </div>

                                <div class="item-details">
                                    Quantity:
                                    ${quantity}
                                    ×
                                    ${formatMoney(price)}
                                </div>
                            </div>

                            <div class="item-price">
                                ${formatMoney(lineTotal)}
                            </div>
                        </div>
                    `;
                }).join("");

                return `
                    <article class="order-card">

                        <div class="order-header">
                            <div>
                                <div class="order-number">
                                    Order #${escapeHtml(
                                        order.order_number
                                    )}
                                </div>

                                <div>
                                    ${formatDate(
                                        order.created_at
                                    )}
                                </div>
                            </div>

                            <div class="status">
                                ${escapeHtml(
                                    order.status || "Processing"
                                )}
                            </div>
                        </div>

                        <div class="section">
                            <h3>Customer Information</h3>

                            <div class="customer-info">

                                <div class="info-item">
                                    <strong>Name</strong>
                                    ${escapeHtml(
                                        order.recipient_name
                                    )}
                                </div>

                                <div class="info-item">
                                    <strong>Email</strong>
                                    ${escapeHtml(
                                        order.customer_email
                                    )}
                                </div>

                                <div class="info-item">
                                    <strong>Phone</strong>
                                    ${escapeHtml(
                                        order.phone
                                    )}
                                </div>

                                <div class="info-item">
                                    <strong>County</strong>
                                    ${escapeHtml(
                                        order.county
                                    )}
                                </div>

                                <div class="info-item">
                                    <strong>Town / Area</strong>
                                    ${escapeHtml(
                                        order.town
                                    )}
                                </div>

                                <div class="info-item">
                                    <strong>Address</strong>
                                    ${escapeHtml(
                                        order.address
                                    )}
                                </div>

                            </div>
                        </div>

                        <div class="section">
                            <h3>Your Products in This Order</h3>

                            <div class="seller-items">
                                ${itemHtml}
                            </div>

                            <div class="totals">
                                <div>
                                    Your item subtotal:
                                    <strong>
                                        ${formatMoney(
                                            sellerSubtotal
                                        )}
                                    </strong>
                                </div>

                                <div>
                                    Customer order total:
                                    <strong>
                                        ${formatMoney(
                                            order.total
                                        )}
                                    </strong>
                                </div>
                            </div>
                        </div>

                        <div class="section">
                            <h3>Payment & Delivery</h3>

                            <div class="payment-info">

                                <div class="info-item">
                                    <strong>Payment Method</strong>
                                    ${escapeHtml(
                                        order.payment_method
                                    )}
                                </div>

                                <div class="info-item">
                                    <strong>Order Status</strong>
                                    ${escapeHtml(
                                        order.status
                                    )}
                                </div>

                                <div class="info-item">
                                    <strong>Delivery Fee</strong>
                                    ${formatMoney(
                                        order.delivery_fee
                                    )}
                                </div>

                                <div class="info-item">
                                    <strong>Delivery Note</strong>
                                    ${escapeHtml(
                                        order.delivery_note ||
                                        "None"
                                    )}
                                </div>

                            </div>
                        </div>

                    </article>
                `;
            }).join("");

        } catch (error) {
            console.error(error);

            message.className = "error";
            message.textContent =
                error.message ||
                "Unable to load seller orders.";
        }
    }

    loadSellerOrders();
</script>

</body>
</html>
