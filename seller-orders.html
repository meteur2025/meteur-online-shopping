<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Orders - Meteur Online Shopping</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #222;
        }

        body.auth-checking {
            visibility: hidden;
        }

        header {
            background: #f4511e;
            color: white;
            padding: 18px 20px;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px 60px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .intro {
            color: #666;
            margin-bottom: 25px;
        }

        .message {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
        }

        .message.success {
            background: #edf8ef;
            color: #2e7d32;
        }

        .loading {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .empty {
            background: white;
            padding: 35px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            color: #666;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            margin-bottom: 25px;
            padding: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.07);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .order-top h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .order-date {
            color: #777;
            font-size: 14px;
        }

        .status-badge {
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            background: #fff3ed;
            color: #f4511e;
        }

        .status-badge.shipped,
        .status-badge.out-for-delivery {
            background: #eef4ff;
            color: #1565c0;
        }

        .status-badge.delivered {
            background: #edf8ef;
            color: #2e7d32;
        }

        .status-badge.cancelled {
            background: #ffebee;
            color: #c62828;
        }

        .section {
            margin-bottom: 24px;
        }

        .section h3 {
            margin: 0 0 14px;
            font-size: 17px;
        }

        .customer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .info-box {
            background: #f8f8f8;
            padding: 14px;
            border-radius: 8px;
        }

        .info-box span {
            display: block;
            color: #777;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .info-box strong {
            font-size: 14px;
            word-break: break-word;
        }

        .product-list {
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
        }

        .product-row {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .product-row:last-child {
            border-bottom: none;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .product-meta {
            color: #666;
            font-size: 14px;
        }

        .subtotal {
            margin-top: 12px;
            font-weight: bold;
            text-align: right;
        }

        .payment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .status-control {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .status-control label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .status-row {
            display: flex;
            gap: 10px;
        }

        .status-select {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            background: white;
            font-size: 14px;
        }

        .update-button {
            border: none;
            background: #f4511e;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-button:hover {
            background: #d84315;
        }

        .update-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px 20px;
        }

        @media (max-width: 700px) {
            .header-inner,
            .order-top,
            .status-row {
                flex-direction: column;
                align-items: stretch;
            }

            .customer-grid,
            .payment-grid {
                grid-template-columns: 1fr;
            }

            .update-button {
                width: 100%;
            }
        }
    </style>
</head>

<body class="auth-checking">

<header>
    <div class="header-inner">

        <div class="brand">
            Meteur Online Shopping
        </div>

        <a
            href="seller-dashboard.html"
            class="back-link"
        >
            Seller Dashboard
        </a>

    </div>
</header>

<main>

    <h1>
        Seller Orders
    </h1>

    <p class="intro">
        View orders containing products from your store.
    </p>

    <div
        id="errorMessage"
        class="message error"
    ></div>

    <div
        id="successMessage"
        class="message success"
    ></div>

    <div
        id="loading"
        class="loading"
    >
        Loading seller orders...
    </div>

    <div id="ordersContainer"></div>

</main>

<footer>
    © 2026 Meteur Online Shopping. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://nytsdeupaootukcullgi.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_cIqzHoafy_AEdB48KS_Wpg_LDqE1sFC";

    const db =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    async function checkSellerAccess() {

        try {

            const userResult =
                await db.auth.getUser();

            if (
                userResult.error ||
                !userResult.data.user
            ) {

                window.location.replace(
                    "login.html"
                );

                return false;

            }


            const user =
                userResult.data.user;


            const sellerResult =
                await db
                    .from("sellers")
                    .select("id, status")
                    .eq("user_id", user.id)
                    .maybeSingle();


            if (sellerResult.error) {

                console.error(
                    "Seller access error:",
                    sellerResult.error
                );

                window.location.replace(
                    "dashboard.html"
                );

                return false;

            }


            const seller =
                sellerResult.data;


            if (
                !seller ||
                seller.status !== "Approved"
            ) {

                window.location.replace(
                    "dashboard.html"
                );

                return false;

            }


            document.body.classList.remove(
                "auth-checking"
            );

            return true;


        } catch (error) {

            console.error(
                "Seller access check failed:",
                error
            );

            window.location.replace(
                "dashboard.html"
            );

            return false;

        }

    }


    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDate(value) {

        if (!value) {
            return "Date unavailable";
        }

        const date =
            new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "Date unavailable";
        }

        return date.toLocaleString(
            "en-GB",
            {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    function formatMoney(value) {

        const amount =
            Number(value || 0);

        return "KSh " +
            amount.toLocaleString(
                "en-KE",
                {
                    maximumFractionDigits: 0
                }
            );

    }


    function statusClass(status) {

        return String(status || "")
            .toLowerCase()
            .replace(/\s+/g, "-");

    }


    function showError(message) {

        const element =
            document.getElementById(
                "errorMessage"
            );

        element.textContent =
            message;

        element.style.display =
            "block";

        document.getElementById(
            "successMessage"
        ).style.display =
            "none";

    }


    function showSuccess(message) {

        const element =
            document.getElementById(
                "successMessage"
            );

        element.textContent =
            message;

        element.style.display =
            "block";

        document.getElementById(
            "errorMessage"
        ).style.display =
            "none";

    }


    function hideMessages() {

        document.getElementById(
            "errorMessage"
        ).style.display =
            "none";

        document.getElementById(
            "successMessage"
        ).style.display =
            "none";

    }


    async function updateOrderStatus(
        orderId,
        selectElement,
        buttonElement
    ) {

        const newStatus =
            selectElement.value;

        if (!newStatus) {
            return;
        }

        hideMessages();

        buttonElement.disabled =
            true;

        buttonElement.textContent =
            "Updating...";


        try {

            const result =
                await db.rpc(
                    "update_seller_order_status",
                    {
                        p_order_id:
                            orderId,

                        p_status:
                            newStatus
                    }
                );


            if (result.error) {

                console.error(
                    "Status update error:",
                    result.error
                );

                showError(
                    result.error.message ||
                    "Unable to update the order status."
                );

                return;

            }


            showSuccess(
                "Order status updated to " +
                newStatus +
                "."
            );


            await loadSellerOrders();


        } catch (error) {

            console.error(
                "Status update error:",
                error
            );

            showError(
                "Unable to update the order status. Please try again."
            );

        } finally {

            buttonElement.disabled =
                false;

            buttonElement.textContent =
                "Update Status";

        }

    }


    function renderOrder(order) {

        const items =
            Array.isArray(order.items)
                ? order.items
                : [];


        let itemSubtotal = 0;

        let productHtml = "";


        items.forEach(
            function(item) {

                const quantity =
                    Number(item.quantity || 1);

                const price =
                    Number(item.price || 0);

                itemSubtotal +=
                    quantity * price;


                productHtml += `
                    <div class="product-row">

                        <div class="product-name">
                            ${escapeHtml(
                                item.name ||
                                "Product"
                            )}
                        </div>

                        <div class="product-meta">
                            Quantity: ${quantity}
                            ×
                            ${formatMoney(price)}
                        </div>

                        <div class="subtotal">
                            ${formatMoney(
                                quantity * price
                            )}
                        </div>

                    </div>
                `;

            }
        );


        if (!productHtml) {

            productHtml = `
                <div class="product-row">
                    No seller products found in this order.
                </div>
            `;

        }


        const currentStatus =
            order.status ||
            "Processing";


        return `
            <article class="order-card">

                <div class="order-top">

                    <div>

                        <h2>
                            Order #
                            ${escapeHtml(
                                order.order_number
                            )}
                        </h2>

                        <div class="order-date">
                            ${formatDate(
                                order.created_at
                            )}
                        </div>

                    </div>

                    <div
                        class="status-badge ${statusClass(
                            currentStatus
                        )}"
                    >
                        ${escapeHtml(
                            currentStatus
                        )}
                    </div>

                </div>


                <section class="section">

                    <h3>
                        Customer Information
                    </h3>

                    <div class="customer-grid">

                        <div class="info-box">
                            <span>Name</span>
                            <strong>
                                ${escapeHtml(
                                    order.recipient_name
                                )}
                            </strong>
                        </div>

                        <div class="info-box">
                            <span>Email</span>
                            <strong>
                                ${escapeHtml(
                                    order.customer_email
                                )}
                            </strong>
                        </div>

                        <div class="info-box">
                            <span>Phone</span>
                            <strong>
                                ${escapeHtml(
                                    order.phone
                                )}
                            </strong>
                        </div>

                        <div class="info-box">
                            <span>County</span>
                            <strong>
                                ${escapeHtml(
                                    order.county
                                )}
                            </strong>
                        </div>

                        <div class="info-box">
                            <span>Town / Area</span>
                            <strong>
                                ${escapeHtml(
                                    order.town
                                )}
                            </strong>
                        </div>

                        <div class="info-box">
                            <span>Address</span>
                            <strong>
                                ${escapeHtml(
                                    order.address
                                )}
                            </strong>
                        </div>

                    </div>

                </section>


                <section class="section">

                    <h3>
                        Your Products in This Order
                    </h3>

                    <div class="product-list">
                        ${productHtml}
                    </div>

                    <div class="subtotal">
                        Your item subtotal:
                        ${formatMoney(
                            itemSubtotal
                        )}
                    </div>

                </section>


                <section class="section">

                    <h3>
                        Payment & Delivery
                    </h3>

                    <div class="payment-grid">

                        <div class="info-box">
                            <span>Payment Method</span>
                            <strong>
                                ${escapeHtml(
                                    order.payment_method
                                )}
                            </strong>
                        </div>

                        <div class="info-box">
                            <span>Order Status</span>
                            <strong>
                                ${escapeHtml(
                                    currentStatus
                                )}
                            </strong>
                        </div>

                        <div class="info-box">
                            <span>Delivery Fee</span>
                            <strong>
                                ${formatMoney(
                                    order.delivery_fee
                                )}
                            </strong>
                        </div>

                        <div class="info-box">
                            <span>Delivery Note</span>
                            <strong>
                                ${escapeHtml(
                                    order.delivery_note ||
                                    "None"
                                )}
                            </strong>
                        </div>

                    </div>

                </section>


                <section class="status-control">

                    <label>
                        Update Order Status
                    </label>

                    <div class="status-row">

                        <select
                            class="status-select"
                            data-order-id="${escapeHtml(
                                order.order_id
                            )}"
                        >

                            <option
                                value="Processing"
                                ${currentStatus === "Processing"
                                    ? "selected"
                                    : ""}
                            >
                                Processing
                            </option>

                            <option
                                value="Shipped"
                                ${currentStatus === "Shipped"
                                    ? "selected"
                                    : ""}
                            >
                                Shipped
                            </option>

                            <option
                                value="Out for Delivery"
                                ${currentStatus === "Out for Delivery"
                                    ? "selected"
                                    : ""}
                            >
                                Out for Delivery
                            </option>

                            <option
                                value="Delivered"
                                ${currentStatus === "Delivered"
                                    ? "selected"
                                    : ""}
                            >
                                Delivered
                            </option>

                            <option
                                value="Cancelled"
                                ${currentStatus === "Cancelled"
                                    ? "selected"
                                    : ""}
                            >
                                Cancelled
                            </option>

                        </select>


                        <button
                            type="button"
                            class="update-button"
                            data-order-id="${escapeHtml(
                                order.order_id
                            )}"
                        >
                            Update Status
                        </button>

                    </div>

                </section>

            </article>
        `;

    }


    function attachStatusHandlers() {

        const buttons =
            document.querySelectorAll(
                ".update-button"
            );


        buttons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        const orderId =
                            button.dataset.orderId;

                        const select =
                            document.querySelector(
                                `.status-select[data-order-id="${orderId}"]`
                            );


                        if (!select) {

                            showError(
                                "Status control could not be found."
                            );

                            return;

                        }


                        updateOrderStatus(
                            orderId,
                            select,
                            button
                        );

                    }
                );

            }
        );

    }


    async function loadSellerOrders() {

        const loading =
            document.getElementById(
                "loading"
            );

        const container =
            document.getElementById(
                "ordersContainer"
            );


        loading.style.display =
            "block";

        container.innerHTML =
            "";


        try {

            const result =
                await db.rpc(
                    "get_seller_orders"
                );


            if (result.error) {

                console.error(
                    "Seller orders error:",
                    result.error
                );

                showError(
                    result.error.message ||
                    "Unable to load seller orders."
                );

                loading.style.display =
                    "none";

                return;

            }


            const orders =
                result.data || [];


            loading.style.display =
                "none";


            if (!orders.length) {

                container.innerHTML = `
                    <div class="empty">
                        No seller orders yet.
                    </div>
                `;

                return;

            }


            container.innerHTML =
                orders
                    .map(renderOrder)
                    .join("");


            attachStatusHandlers();


        } catch (error) {

            console.error(
                "Seller orders loading error:",
                error
            );

            loading.style.display =
                "none";

            showError(
                "Unable to load seller orders. Please try again."
            );

        }

    }


    async function startPage() {

        const accessGranted =
            await checkSellerAccess();


        if (!accessGranted) {
            return;
        }


        await loadSellerOrders();

    }


    startPage();

</script>

</body>
</html>
