<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Products | Meteur Seller</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        header {
            background: #f97316;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .top h1 {
            font-size: 30px;
        }

        .add-btn {
            background: #f97316;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .form-card {
            display: none;
        }

        .form-card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #f97316;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-buttons {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .save-btn {
            background: #f97316;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn {
            background: #eee;
            color: #333;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }

        .product-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #eee;
        }

        .product-body {
            padding: 17px;
        }

        .product-body h3 {
            margin-bottom: 8px;
        }

        .category {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .price {
            color: #f97316;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .stock {
            color: #555;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-btn {
            background: #fff7ed;
            color: #c2410c;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .message {
            text-align: center;
            padding: 35px;
            color: #666;
        }

        .error {
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 13px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 850px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .top {
                flex-direction: column;
                align-items: stretch;
            }

            .add-btn {
                width: 100%;
            }

            header {
                padding: 16px 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Meteur Seller</div>
    <a href="seller-dashboard.html">Seller Dashboard</a>
</header>

<main>

    <div class="top">
        <h1>My Products</h1>

        <button class="add-btn" id="addProductBtn">
            + Add Product
        </button>
    </div>

    <div id="successMessage" class="success"></div>

    <section class="card form-card" id="productFormCard">

        <h2 id="formTitle">Add New Product</h2>

        <form id="productForm">

            <div class="form-grid">

                <div class="field">
                    <label for="name">Product Name</label>
                    <input id="name" type="text" required>
                </div>

                <div class="field">
                    <label for="category">Category</label>

                    <select id="category" required>
                        <option value="">Select category</option>
                        <option>Phones and Tablets</option>
                        <option>Computing</option>
                        <option>Electronics</option>
                        <option>Shoes</option>
                        <option>Smart Devices</option>
                        <option>Cameras</option>
                        <option>Kitchen</option>
                        <option>Fashion</option>
                        <option>Home and Appliances</option>
                        <option>Beauty</option>
                        <option>Sports</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="price">Price (KSh)</label>
                    <input id="price" type="number" min="1" required>
                </div>

                <div class="field">
                    <label for="oldPrice">Old Price (KSh)</label>
                    <input id="oldPrice" type="number" min="0">
                </div>

                <div class="field">
                    <label for="stock">Stock</label>
                    <input id="stock" type="number" min="0" required>
                </div>

                <div class="field">
                    <label for="imageUrl">Product Image URL</label>
                    <input id="imageUrl" type="url"
                           placeholder="https://example.com/image.jpg">
                </div>

                <div class="field full">
                    <label for="description">Description</label>
                    <textarea id="description"
                              placeholder="Describe your product"></textarea>
                </div>

                <div class="field">
                    <label for="badge">Badge</label>
                    <input id="badge"
                           type="text"
                           placeholder="New, Deal, Popular">
                </div>

                <div class="field">
                    <label for="listingType">Listing Type</label>

                    <select id="listingType">
                        <option value="normal">Normal Product</option>
                        <option value="deal">Flash Deal</option>
                        <option value="new">New Arrival</option>
                    </select>
                </div>

            </div>

            <div class="form-buttons">

                <button class="save-btn" type="submit">
                    Save Product
                </button>

                <button class="cancel-btn"
                        type="button"
                        id="cancelBtn">
                    Cancel
                </button>

            </div>

        </form>

    </section>

    <section class="card">

        <div id="productsContainer">

            <div class="message">
                Loading products...
            </div>

        </div>

    </section>

</main>

<script>

    let currentUser = null;
    let seller = null;
    let editingProductId = null;

    const formCard =
        document.getElementById("productFormCard");

    const productForm =
        document.getElementById("productForm");

    const productsContainer =
        document.getElementById("productsContainer");

    const successMessage =
        document.getElementById("successMessage");

    const formTitle =
        document.getElementById("formTitle");

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function showSuccess(message) {

        successMessage.textContent = message;
        successMessage.style.display = "block";

        setTimeout(() => {
            successMessage.style.display = "none";
        }, 3500);
    }

    async function initialize() {

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();

        if (userError || !user) {

            window.location.href =
                "login.html?redirect=seller-products.html";

            return;
        }

        currentUser = user;

        const {
            data: sellerData,
            error: sellerError
        } = await supabaseClient
            .from("sellers")
            .select("*")
            .eq("user_id", user.id)
            .maybeSingle();

        if (sellerError) {

            productsContainer.innerHTML = `
                <div class="message error">
                    Unable to load seller account.
                </div>
            `;

            return;
        }

        if (!sellerData) {

            productsContainer.innerHTML = `
                <div class="message">
                    <h2>Seller application required</h2>
                    <p>
                        Please submit your seller application first.
                    </p>
                    <br>
                    <a href="seller-register.html"
                       style="color:#f97316;font-weight:bold;">
                        Become a Seller
                    </a>
                </div>
            `;

            document.getElementById("addProductBtn").disabled = true;

            return;
        }

        seller = sellerData;

        await loadProducts();
    }

    async function loadProducts() {

        const {
            data: products,
            error
        } = await supabaseClient
            .from("products")
            .select("*")
            .order("created_at", {
                ascending: false
            });

        if (error) {

            productsContainer.innerHTML = `
                <div class="message error">
                    Unable to load products.
                </div>
            `;

            return;
        }

        if (!products || products.length === 0) {

            productsContainer.innerHTML = `
                <div class="message">
                    <h2>No products yet</h2>
                    <p>
                        Click "Add Product" to create your first product.
                    </p>
                </div>
            `;

            return;
        }

        productsContainer.innerHTML = `
            <div class="products-grid">

                ${products.map(product => `

                    <article class="product-card">

                        <img
                            class="product-image"
                            src="${escapeHtml(
                                product.image_url ||
                                "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80"
                            )}"
                            alt="${escapeHtml(product.name)}"
                        >

                        <div class="product-body">

                            <h3>
                                ${escapeHtml(product.name)}
                            </h3>

                            <div class="category">
                                ${escapeHtml(product.category)}
                            </div>

                            <div class="price">
                                KSh ${Number(product.price).toLocaleString()}
                            </div>

                            <div class="stock">
                                Stock: ${Number(product.stock)}
                            </div>

                            <div class="product-actions">

                                <button
                                    class="edit-btn"
                                    onclick="editProduct('${product.id}')">
                                    Edit
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteProduct('${product.id}')">
                                    Delete
                                </button>

                            </div>

                        </div>

                    </article>

                `).join("")}

            </div>
        `;
    }

    document.getElementById("addProductBtn")
        .addEventListener("click", function() {

            editingProductId = null;

            formTitle.textContent =
                "Add New Product";

            productForm.reset();

            formCard.style.display = "block";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });

    document.getElementById("cancelBtn")
        .addEventListener("click", function() {

            formCard.style.display = "none";

            productForm.reset();

            editingProductId = null;
        });

    productForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const productData = {

            name:
                document.getElementById("name").value.trim(),

            category:
                document.getElementById("category").value,

            price:
                Number(document.getElementById("price").value),

            old_price:
                Number(document.getElementById("oldPrice").value) || null,

            stock:
                Number(document.getElementById("stock").value),

            image_url:
                document.getElementById("imageUrl").value.trim() || null,

            description:
                document.getElementById("description").value.trim(),

            badge:
                document.getElementById("badge").value.trim() || null,

            is_deal:
                document.getElementById("listingType").value === "deal",

            is_new:
                document.getElementById("listingType").value === "new"
        };

        if (
            !productData.name ||
            !productData.category ||
            productData.price <= 0
        ) {

            alert("Please enter valid product information.");

            return;
        }

        const saveButton =
            productForm.querySelector(".save-btn");

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {

            let error;

            if (editingProductId) {

                const result =
                    await supabaseClient
                        .from("products")
                        .update({
                            ...productData,
                            updated_at:
                                new Date().toISOString()
                        })
                        .eq("id", editingProductId);

                error = result.error;

            } else {

                const result =
                    await supabaseClient
                        .from("products")
                        .insert(productData);

                error = result.error;
            }

            if (error) {
                throw error;
            }

            showSuccess(
                editingProductId
                    ? "Product updated successfully."
                    : "Product added successfully."
            );

            productForm.reset();

            editingProductId = null;

            formCard.style.display = "none";

            await loadProducts();

        } catch (error) {

            console.error("Product save error:", error);

            alert(
                error.message ||
                "Unable to save product."
            );

        } finally {

            saveButton.disabled = false;
            saveButton.textContent = "Save Product";
        }
    });

    window.editProduct = async function(productId) {

        const {
            data: product,
            error
        } = await supabaseClient
            .from("products")
            .select("*")
            .eq("id", productId)
            .maybeSingle();

        if (error || !product) {

            alert("Unable to load product.");

            return;
        }

        editingProductId = productId;

        formTitle.textContent =
            "Edit Product";

        document.getElementById("name").value =
            product.name || "";

        document.getElementById("category").value =
            product.category || "";

        document.getElementById("price").value =
            product.price || "";

        document.getElementById("oldPrice").value =
            product.old_price || "";

        document.getElementById("stock").value =
            product.stock || "";

        document.getElementById("imageUrl").value =
            product.image_url || "";

        document.getElementById("description").value =
            product.description || "";

        document.getElementById("badge").value =
            product.badge || "";

        document.getElementById("listingType").value =
            product.is_deal
                ? "deal"
                : product.is_new
                    ? "new"
                    : "normal";

        formCard.style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    };

    window.deleteProduct = async function(productId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this product?"
            );

        if (!confirmed) {
            return;
        }

        const {
            error
        } = await supabaseClient
            .from("products")
            .delete()
            .eq("id", productId);

        if (error) {

            alert(
                error.message ||
                "Unable to delete product."
            );

            return;
        }

        showSuccess(
            "Product deleted successfully."
        );

        await loadProducts();
    };

    initialize();

</script>

</body>
</html>
