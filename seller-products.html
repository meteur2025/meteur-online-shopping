<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Products - Meteur Online Shopping</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ff7a00;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 21px;
    }

    header a,
    header button {
      color: white;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .top-card,
    .product-card,
    .edit-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .top-card h2 {
      margin-bottom: 8px;
    }

    .top-card p {
      color: #666;
    }

    .message {
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      background: #fff3e8;
      color: #c65f00;
    }

    .product-card {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 22px;
      align-items: center;
    }

    .product-image {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .category {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #ff7a00;
      margin-bottom: 6px;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      margin-left: 8px;
      font-size: 14px;
    }

    .stock {
      margin: 8px 0;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      background: #ff7a00;
      color: white;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .edit-btn {
      background: #ff7a00;
      color: white;
    }

    .delete-btn {
      background: #e53935;
      color: white;
    }

    .save-btn {
      background: #ff7a00;
      color: white;
    }

    .cancel-btn {
      background: #777;
      color: white;
    }

    .empty {
      background: white;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    .edit-card {
      display: none;
    }

    .edit-card h2 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-top: 8px;
    }

    .checkbox-item {
      display: flex;
      gap: 7px;
      align-items: center;
      font-size: 14px;
    }

    .edit-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 20px;
    }

    @media (max-width: 650px) {
      .product-card {
        grid-template-columns: 1fr;
      }

      .product-image {
        width: 100%;
        height: 220px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      header {
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Meteur Seller</h1>

  <div>
    <a href="seller-dashboard.html">Seller Dashboard</a>
    &nbsp;&nbsp;
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div id="loading" class="loading">
  Checking seller access...
</div>

<main id="content" class="container" style="display:none;">

  <section class="top-card">
    <h2>Seller Products</h2>
    <p>Manage the products listed by your store.</p>
  </section>

  <div id="message" class="message"></div>

  <section id="editCard" class="edit-card">

    <h2>Edit Product</h2>

    <form id="editForm">

      <div class="form-grid">

        <div class="form-group full">
          <label for="productName">Product Name</label>
          <input
            type="text"
            id="productName"
            required
          >
        </div>

        <div class="form-group">
          <label for="productCategory">Category</label>

          <select id="productCategory" required>
            <option value="Phones and Tablets">Phones and Tablets</option>
            <option value="Electronics">Electronics</option>
            <option value="Smart Devices">Smart Devices</option>
            <option value="Computers">Computers</option>
            <option value="Fashion">Fashion</option>
            <option value="Home and Kitchen">Home and Kitchen</option>
            <option value="Beauty">Beauty</option>
            <option value="Sports">Sports</option>
            <option value="Accessories">Accessories</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="productBadge">Badge</label>
          <input
            type="text"
            id="productBadge"
            placeholder="Example: NEW"
          >
        </div>

        <div class="form-group">
          <label for="productPrice">Price (KSh)</label>
          <input
            type="number"
            id="productPrice"
            min="0"
            step="0.01"
            required
          >
        </div>

        <div class="form-group">
          <label for="productOldPrice">Old Price (KSh)</label>
          <input
            type="number"
            id="productOldPrice"
            min="0"
            step="0.01"
          >
        </div>

        <div class="form-group">
          <label for="productStock">Stock</label>
          <input
            type="number"
            id="productStock"
            min="0"
            step="1"
            required
          >
        </div>

        <div class="form-group">
          <label for="productRating">Rating</label>
          <input
            type="number"
            id="productRating"
            min="0"
            max="5"
            step="0.1"
          >
        </div>

        <div class="form-group">
          <label for="productReviews">Review Count</label>
          <input
            type="number"
            id="productReviews"
            min="0"
            step="1"
          >
        </div>

        <div class="form-group full">
          <label for="productImage">Image URL</label>
          <input
            type="url"
            id="productImage"
            placeholder="https://..."
          >
        </div>

        <div class="form-group full">
          <label for="productDescription">Description</label>
          <textarea
            id="productDescription"
            placeholder="Product description"
          ></textarea>
        </div>

        <div class="form-group full">

          <label>Product Options</label>

          <div class="checkbox-row">

            <label class="checkbox-item">
              <input
                type="checkbox"
                id="productDeal"
              >
              Deal
            </label>

            <label class="checkbox-item">
              <input
                type="checkbox"
                id="productNew"
              >
              New Arrival
            </label>

          </div>

        </div>

      </div>

      <div class="edit-actions">

        <button
          type="submit"
          class="btn save-btn"
        >
          Update Product
        </button>

        <button
          type="button"
          class="btn cancel-btn"
          onclick="cancelEdit()"
        >
          Cancel
        </button>

      </div>

    </form>

  </section>

  <div id="products"></div>

</main>

<footer>
  © 2026 Meteur Online Shopping. All rights reserved.
</footer>

<script>
  const SUPABASE_URL =
    "https://nytsdeupaootukcullgi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_cIqzHoafy_AEdB48KS_Wpg_LDqE1sFC";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentSeller = null;
  let editingProductId = null;

  async function checkSellerAccess() {

    try {

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        window.location.href = "login.html";
        return;
      }

      const {
        data: seller,
        error: sellerError
      } = await supabaseClient
        .from("sellers")
        .select("*")
        .eq("user_id", user.id)
        .maybeSingle();

      if (sellerError || !seller) {
        window.location.href = "dashboard.html";
        return;
      }

      if (seller.status !== "Approved") {
        window.location.href = "dashboard.html";
        return;
      }

      currentSeller = seller;

      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";

      await loadProducts();

    } catch (error) {

      console.error(error);

      window.location.href = "dashboard.html";
    }
  }

  async function loadProducts() {

    const container =
      document.getElementById("products");

    const {
      data: products,
      error
    } = await supabaseClient
      .from("products")
      .select("*")
      .eq("seller_id", currentSeller.id)
      .order("created_at", {
        ascending: false
      });

    if (error) {

      console.error(error);

      container.innerHTML =
        '<div class="empty">Unable to load your products.</div>';

      return;
    }

    if (!products || products.length === 0) {

      container.innerHTML =
        '<div class="empty">You have no products listed yet.</div>';

      return;
    }

    container.innerHTML =
      products.map(product => {

        const image =
          product.image_url ||
          "https://via.placeholder.com/400x400?text=Meteur";

        return `
          <section class="product-card">

            <img
              class="product-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.name || "Product")}"
              onerror="this.src='https://via.placeholder.com/400x400?text=Meteur';"
            >

            <div class="product-info">

              ${
                product.badge
                  ? `<span class="badge">${escapeHtml(product.badge)}</span>`
                  : ""
              }

              <h3>
                ${escapeHtml(product.name)}
              </h3>

              <div class="category">
                ${escapeHtml(
                  product.category || "Uncategorized"
                )}
              </div>

              <div class="price">
                KSh ${Number(
                  product.price || 0
                ).toLocaleString()}

                ${
                  product.old_price
                    ? `
                      <span class="old-price">
                        KSh ${Number(
                          product.old_price
                        ).toLocaleString()}
                      </span>
                    `
                    : ""
                }
              </div>

              <div class="stock">
                Stock:
                <strong>
                  ${Number(product.stock || 0)}
                </strong>
              </div>

              <div>
                Rating:
                <strong>
                  ${Number(
                    product.rating || 0
                  ).toFixed(1)}
                </strong>

                (
                ${Number(
                  product.review_count || 0
                )}
                reviews)
              </div>

              <div class="actions">

                <button
                  class="btn edit-btn"
                  onclick="editProduct('${product.id}')"
                >
                  Edit
                </button>

                <button
                  class="btn delete-btn"
                  onclick="deleteProduct('${product.id}')"
                >
                  Delete
                </button>

              </div>

            </div>

          </section>
        `;

      }).join("");
  }

  async function editProduct(productId) {

    const {
      data: product,
      error
    } = await supabaseClient
      .from("products")
      .select("*")
      .eq("id", productId)
      .eq("seller_id", currentSeller.id)
      .maybeSingle();

    if (error || !product) {

      showMessage(
        "Product not found or access denied."
      );

      return;
    }

    editingProductId = productId;

    document.getElementById("productName").value =
      product.name || "";

    document.getElementById("productCategory").value =
      product.category || "Other";

    document.getElementById("productPrice").value =
      product.price ?? "";

    document.getElementById("productOldPrice").value =
      product.old_price ?? "";

    document.getElementById("productStock").value =
      product.stock ?? 0;

    document.getElementById("productRating").value =
      product.rating ?? 0;

    document.getElementById("productReviews").value =
      product.review_count ?? 0;

    document.getElementById("productBadge").value =
      product.badge || "";

    document.getElementById("productImage").value =
      product.image_url || "";

    document.getElementById("productDescription").value =
      product.description || "";

    document.getElementById("productDeal").checked =
      Boolean(product.is_deal);

    document.getElementById("productNew").checked =
      Boolean(product.is_new);

    const editCard =
      document.getElementById("editCard");

    editCard.style.display = "block";

    editCard.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  document
    .getElementById("editForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      if (!editingProductId) {
        showMessage("No product selected.");
        return;
      }

      const name =
        document.getElementById("productName").value.trim();

      const category =
        document.getElementById("productCategory").value;

      const price =
        Number(
          document.getElementById("productPrice").value
        );

      const oldPriceValue =
        document.getElementById("productOldPrice").value;

      const oldPrice =
        oldPriceValue === ""
          ? null
          : Number(oldPriceValue);

      const stock =
        Number(
          document.getElementById("productStock").value
        );

      const ratingValue =
        document.getElementById("productRating").value;

      const rating =
        ratingValue === ""
          ? 0
          : Number(ratingValue);

      const reviewValue =
        document.getElementById("productReviews").value;

      const reviewCount =
        reviewValue === ""
          ? 0
          : Number(reviewValue);

      const badge =
        document.getElementById("productBadge").value.trim();

      const imageUrl =
        document.getElementById("productImage").value.trim();

      const description =
        document
          .getElementById("productDescription")
          .value.trim();

      const isDeal =
        document.getElementById("productDeal").checked;

      const isNew =
        document.getElementById("productNew").checked;

      if (!name) {
        showMessage("Product name is required.");
        return;
      }

      if (!Number.isFinite(price) || price < 0) {
        showMessage("Please enter a valid price.");
        return;
      }

      if (!Number.isInteger(stock) || stock < 0) {
        showMessage("Please enter a valid stock quantity.");
        return;
      }

      if (
        !Number.isFinite(rating) ||
        rating < 0 ||
        rating > 5
      ) {
        showMessage(
          "Rating must be between 0 and 5."
        );
        return;
      }

      if (
        !Number.isInteger(reviewCount) ||
        reviewCount < 0
      ) {
        showMessage(
          "Please enter a valid review count."
        );
        return;
      }

      const updateButton =
        document.querySelector(
          "#editForm .save-btn"
        );

      updateButton.disabled = true;
      updateButton.textContent = "Updating...";

      const {
        error
      } = await supabaseClient
        .from("products")
        .update({

          name: name,

          category: category,

          price: price,

          old_price: oldPrice,

          stock: stock,

          rating: rating,

          review_count: reviewCount,

          badge:
            badge || null,

          image_url:
            imageUrl || null,

          description:
            description || null,

          is_deal: isDeal,

          is_new: isNew,

          updated_at:
            new Date().toISOString()

        })
        .eq("id", editingProductId)
        .eq("seller_id", currentSeller.id);

      updateButton.disabled = false;
      updateButton.textContent = "Update Product";

      if (error) {

        console.error(error);

        showMessage(
          "Unable to update product: " +
          error.message
        );

        return;
      }

      showMessage(
        "Product updated successfully."
      );

      cancelEdit();

      await loadProducts();
    });

  function cancelEdit() {

    editingProductId = null;

    document.getElementById("editCard").style.display =
      "none";

    document.getElementById("editForm").reset();
  }

  async function deleteProduct(productId) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );

    if (!confirmed) {
      return;
    }

    const {
      error
    } = await supabaseClient
      .from("products")
      .delete()
      .eq("id", productId)
      .eq("seller_id", currentSeller.id);

    if (error) {

      console.error(error);

      showMessage(
        "Unable to delete product."
      );

      return;
    }

    showMessage(
      "Product deleted successfully."
    );

    await loadProducts();
  }

  function showMessage(message) {

    const box =
      document.getElementById("message");

    box.textContent = message;

    box.style.display = "block";

    setTimeout(() => {

      box.style.display = "none";

    }, 4000);
  }

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";
  }

  checkSellerAccess();
</script>

</body>
</html>
