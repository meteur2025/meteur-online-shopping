<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Products - Meteur Online Shopping</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ff7a00;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 21px;
    }

    header a,
    header button {
      color: white;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .top-card,
    .product-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .top-card h2 {
      margin-bottom: 8px;
    }

    .top-card p {
      color: #666;
    }

    .message {
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      background: #fff3e8;
      color: #c65f00;
    }

    .product-card {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 22px;
      align-items: center;
    }

    .product-image {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .category {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #ff7a00;
      margin-bottom: 6px;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      margin-left: 8px;
      font-size: 14px;
    }

    .stock {
      margin: 8px 0;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      background: #ff7a00;
      color: white;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .edit-btn {
      background: #ff7a00;
      color: white;
    }

    .delete-btn {
      background: #e53935;
      color: white;
    }

    .empty {
      background: white;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 20px;
    }

    @media (max-width: 650px) {
      .product-card {
        grid-template-columns: 1fr;
      }

      .product-image {
        width: 100%;
        height: 220px;
      }

      header {
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Meteur Seller</h1>

  <div>
    <a href="seller-dashboard.html">Seller Dashboard</a>
    &nbsp;&nbsp;
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div id="loading" class="loading">
  Checking seller access...
</div>

<main id="content" class="container" style="display:none;">

  <section class="top-card">
    <h2>Seller Products</h2>
    <p>Manage the products listed by your store.</p>
  </section>

  <div id="message" class="message"></div>

  <div id="products"></div>

</main>

<footer>
  © 2026 Meteur Online Shopping. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://nytsdeupaootukcullgi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_cIqzHoafy_AEdB48KS_Wpg_LDqE1sFC";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentSeller = null;

  async function checkSellerAccess() {
    try {
      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        window.location.href = "login.html";
        return;
      }

      const { data: seller, error: sellerError } =
        await supabaseClient
          .from("sellers")
          .select("*")
          .eq("user_id", user.id)
          .maybeSingle();

      if (sellerError || !seller) {
        window.location.href = "dashboard.html";
        return;
      }

      if (seller.status !== "Approved") {
        window.location.href = "dashboard.html";
        return;
      }

      currentSeller = seller;

      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";

      await loadProducts();

    } catch (error) {
      console.error(error);
      window.location.href = "dashboard.html";
    }
  }

  async function loadProducts() {
    const container = document.getElementById("products");

    const { data: products, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("seller_id", currentSeller.id)
        .order("created_at", { ascending: false });

    if (error) {
      console.error(error);

      container.innerHTML =
        '<div class="empty">Unable to load your products.</div>';

      return;
    }

    if (!products || products.length === 0) {
      container.innerHTML =
        '<div class="empty">You have no products listed yet.</div>';

      return;
    }

    container.innerHTML = products.map(product => {

      const image =
        product.image_url ||
        "https://via.placeholder.com/400x400?text=Meteur";

      return `
        <section class="product-card">

          <img
            class="product-image"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(product.name || "Product")}"
            onerror="this.src='https://via.placeholder.com/400x400?text=Meteur';"
          >

          <div class="product-info">

            ${product.badge
              ? `<span class="badge">${escapeHtml(product.badge)}</span>`
              : ""
            }

            <h3>${escapeHtml(product.name)}</h3>

            <div class="category">
              ${escapeHtml(product.category || "Uncategorized")}
            </div>

            <div class="price">
              KSh ${Number(product.price || 0).toLocaleString()}
              ${
                product.old_price
                  ? `<span class="old-price">KSh ${Number(product.old_price).toLocaleString()}</span>`
                  : ""
              }
            </div>

            <div class="stock">
              Stock: <strong>${Number(product.stock || 0)}</strong>
            </div>

            <div>
              Rating:
              <strong>${Number(product.rating || 0).toFixed(1)}</strong>
              (${Number(product.review_count || 0)} reviews)
            </div>

            <div class="actions">

              <button
                class="btn edit-btn"
                onclick="editProduct('${product.id}')"
              >
                Edit
              </button>

              <button
                class="btn delete-btn"
                onclick="deleteProduct('${product.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        </section>
      `;
    }).join("");
  }

  async function editProduct(productId) {
    const { data: product, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .eq("seller_id", currentSeller.id)
        .maybeSingle();

    if (error || !product) {
      showMessage("Product not found or access denied.");
      return;
    }

    const newBadge =
      prompt("Enter the product badge:", product.badge || "");

    if (newBadge === null) {
      return;
    }

    const { error: updateError } =
      await supabaseClient
        .from("products")
        .update({
          badge: newBadge.trim() || null
        })
        .eq("id", productId)
        .eq("seller_id", currentSeller.id);

    if (updateError) {
      console.error(updateError);
      showMessage("Unable to update product.");
      return;
    }

    showMessage("Product updated successfully.");
    await loadProducts();
  }

  async function deleteProduct(productId) {
    const confirmed =
      confirm("Are you sure you want to delete this product?");

    if (!confirmed) {
      return;
    }

    const { error } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", productId)
        .eq("seller_id", currentSeller.id);

    if (error) {
      console.error(error);
      showMessage("Unable to delete product.");
      return;
    }

    showMessage("Product deleted successfully.");
    await loadProducts();
  }

  function showMessage(message) {
    const box = document.getElementById("message");

    box.textContent = message;
    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 4000);
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  }

  checkSellerAccess();
</script>

</body>
</html>
