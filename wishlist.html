<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Meteur Online Shopping</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #f68b1e;
            color: white;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: bold;
        }

        .search {
            flex: 1;
            max-width: 550px;
            display: flex;
        }

        .search input {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 5px 0 0 5px;
            font-size: 15px;
        }

        .search button {
            padding: 13px 20px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: relative;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 15px;
        }

        .product-info h3 {
            font-size: 17px;
            margin-bottom: 10px;
            min-height: 42px;
        }

        .product-info h3 a {
            color: #222;
            text-decoration: none;
        }

        .price {
            color: #f68b1e;
            font-size: 20px;
            font-weight: bold;
        }

        .old-price {
            color: #888;
            text-decoration: line-through;
            font-size: 14px;
            margin-top: 3px;
        }

        .rating {
            color: #f68b1e;
            margin: 8px 0;
            font-size: 14px;
        }

        .stock {
            font-size: 13px;
            margin-bottom: 12px;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 11px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-btn {
            background: #f68b1e;
            color: white;
        }

        .remove-btn {
            background: #eee;
            color: #333;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty {
            background: white;
            padding: 50px 20px;
            text-align: center;
            border-radius: 8px;
        }

        .empty a {
            display: inline-block;
            margin-top: 20px;
            background: #f68b1e;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            text-align: center;
            padding: 35px 5%;
        }

        footer a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                max-width: none;
            }

            .nav-links {
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="index.html" class="logo">Meteur</a>

    <form class="search" id="searchForm">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >
        <button type="submit">Search</button>
    </form>

    <div class="nav-links">
        <a href="shop.html">Shop</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="cart.html">Cart</a>
        <a href="dashboard.html">Account</a>
    </div>

</header>

<main class="container">

    <h1>My Wishlist</h1>

    <div id="wishlistContainer">
        <div class="loading">Loading your wishlist...</div>
    </div>

</main>

<footer>

    <p>© 2026 Meteur Online Shopping. All rights reserved.</p>

    <br>

    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="shipping.html">Shipping</a>
    <a href="returns.html">Returns</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>

</footer>

<script>

    let currentUser = null;

    const container =
        document.getElementById("wishlistContainer");

    async function getCurrentUser() {

        const {
            data: { user },
            error
        } = await supabaseClient.auth.getUser();

        if (error) {
            console.error("Authentication error:", error);
            return null;
        }

        return user;
    }

    async function loadWishlist() {

        currentUser = await getCurrentUser();

        if (!currentUser) {

            container.innerHTML = `
                <div class="empty">
                    <h2>Please log in</h2>
                    <p>You need to log in to view your wishlist.</p>

                    <a href="login.html?redirect=wishlist.html">
                        Login
                    </a>
                </div>
            `;

            return;
        }

        const {
            data,
            error
        } = await supabaseClient
            .from("wishlist")
            .select(`
                id,
                product_id,
                products (
                    id,
                    name,
                    category,
                    price,
                    old_price,
                    image_url,
                    rating,
                    review_count,
                    stock,
                    badge
                )
            `)
            .eq("user_id", currentUser.id)
            .order("created_at", { ascending: false });

        if (error) {

            console.error("Wishlist loading error:", error);

            container.innerHTML = `
                <div class="empty">
                    <h2>Unable to load wishlist</h2>
                    <p>Please refresh the page and try again.</p>
                </div>
            `;

            return;
        }

        if (!data || data.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h2>Your wishlist is empty</h2>
                    <p>Save products here so you can find them later.</p>

                    <a href="shop.html">
                        Continue Shopping
                    </a>
                </div>
            `;

            return;
        }

        renderWishlist(data);
    }

    function renderWishlist(items) {

        container.innerHTML = `
            <div class="wishlist-grid">

                ${items.map(item => {

                    const product = item.products;

                    if (!product) {
                        return "";
                    }

                    const price =
                        Number(product.price || 0)
                        .toLocaleString();

                    const oldPrice =
                        product.old_price
                        ? Number(product.old_price)
                            .toLocaleString()
                        : "";

                    const rating =
                        Number(product.rating || 0)
                        .toFixed(1);

                    const stockText =
                        product.stock > 0
                        ? `${product.stock} available`
                        : "Out of stock";

                    const image =
                        product.image_url ||
                        "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80";

                    return `
                        <div class="product-card">

                            <a href="product.html?id=${encodeURIComponent(product.id)}">
                                <img
                                    src="${escapeAttribute(image)}"
                                    alt="${escapeAttribute(product.name)}"
                                >
                            </a>

                            <div class="product-info">

                                <h3>
                                    <a href="product.html?id=${encodeURIComponent(product.id)}">
                                        ${escapeHtml(product.name)}
                                    </a>
                                </h3>

                                <div class="price">
                                    KSh ${price}
                                </div>

                                ${
                                    oldPrice
                                    ? `
                                        <div class="old-price">
                                            KSh ${oldPrice}
                                        </div>
                                    `
                                    : ""
                                }

                                <div class="rating">
                                    ★ ${rating}
                                    (${Number(product.review_count || 0)} reviews)
                                </div>

                                <div class="stock">
                                    ${stockText}
                                </div>

                                <div class="buttons">

                                    <button
                                        class="btn cart-btn"
                                        onclick="addToCart('${product.id}', ${product.stock}, this)"
                                        ${product.stock <= 0 ? "disabled" : ""}
                                    >
                                        Add to Cart
                                    </button>

                                    <button
                                        class="btn remove-btn"
                                        onclick="removeFromWishlist('${item.id}', this)"
                                    >
                                        Remove
                                    </button>

                                </div>

                            </div>

                        </div>
                    `;

                }).join("")}

            </div>
        `;
    }

    async function addToCart(productId, stock, button) {

        if (!currentUser) {

            window.location.href =
                "login.html?redirect=wishlist.html";

            return;
        }

        if (stock <= 0) {

            alert("This product is out of stock.");

            return;
        }

        button.disabled = true;
        button.textContent = "Adding...";

        try {

            const {
                data: existing,
                error: existingError
            } = await supabaseClient
                .from("cart_items")
                .select("id, quantity")
                .eq("user_id", currentUser.id)
                .eq("product_id", productId)
                .maybeSingle();

            if (existingError) {
                throw existingError;
            }

            const existingQuantity =
                existing ? Number(existing.quantity) : 0;

            const newQuantity =
                existingQuantity + 1;

            if (newQuantity > stock) {

                alert(`Only ${stock} item(s) are available.`);

                button.disabled = false;
                button.textContent = "Add to Cart";

                return;
            }

            if (existing) {

                const {
                    error: updateError
                } = await supabaseClient
                    .from("cart_items")
                    .update({
                        quantity: newQuantity,
                        updated_at: new Date().toISOString()
                    })
                    .eq("id", existing.id)
                    .eq("user_id", currentUser.id);

                if (updateError) {
                    throw updateError;
                }

            } else {

                const {
                    error: insertError
                } = await supabaseClient
                    .from("cart_items")
                    .insert({
                        user_id: currentUser.id,
                        product_id: productId,
                        quantity: 1
                    });

                if (insertError) {
                    throw insertError;
                }
            }

            alert("Product added to your cart.");

        } catch (error) {

            console.error("Add to cart error:", error);

            alert(
                "Could not add this product to your cart. Please try again."
            );

        } finally {

            button.disabled = false;
            button.textContent = "Add to Cart";
        }
    }

    async function removeFromWishlist(wishlistId, button) {

        if (!currentUser) {
            return;
        }

        button.disabled = true;
        button.textContent = "Removing...";

        const {
            error
        } = await supabaseClient
            .from("wishlist")
            .delete()
            .eq("id", wishlistId)
            .eq("user_id", currentUser.id);

        if (error) {

            console.error("Remove wishlist error:", error);

            alert(
                "Could not remove the product. Please try again."
            );

            button.disabled = false;
            button.textContent = "Remove";

            return;
        }

        await loadWishlist();
    }

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
        return escapeHtml(value);
    }

    document
        .getElementById("searchForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const search =
                document
                    .getElementById("searchInput")
                    .value
                    .trim();

            if (search) {

                window.location.href =
                    `shop.html?search=${encodeURIComponent(search)}`;

            } else {

                window.location.href =
                    "shop.html";
            }
        });

    loadWishlist();

</script>

</body>
</html>
